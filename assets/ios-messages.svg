<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <style>
      @keyframes run {
        0% { transform: translateX(0); }
        100% { transform: translateX(-100px); }
      }
      @keyframes jump {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-60px); }
      }
      @keyframes cactusMove {
        0% { transform: translateX(0); }
        100% { transform: translateX(-500px); }
      }
      @keyframes cloudMove {
        0% { transform: translateX(0); }
        100% { transform: translateX(-400px); }
      }
      @keyframes pteraMove {
        0% { transform: translateX(0) translateY(0); }
        25% { transform: translateX(-100px) translateY(-10px); }
        50% { transform: translateX(-200px) translateY(0); }
        75% { transform: translateX(-300px) translateY(-10px); }
        100% { transform: translateX(-400px) translateY(0); }
      }
      @keyframes scoreUpdate {
        0%, 100% { opacity: 1; }
      }
      @keyframes groundScroll {
        0% { transform: translateX(0); }
        100% { transform: translateX(-100px); }
      }
      
      .dino { animation: run 0.3s steps(2) infinite; }
      .jumping { animation: jump 0.5s ease infinite; }
      .cactus { animation: cactusMove 2s linear infinite; }
      .cloud { animation: cloudMove 4s linear infinite; }
      .ptera { animation: pteraMove 3s linear infinite; }
      .ground { animation: groundScroll 0.5s linear infinite; }
    </style>
  </defs>
  
  <!-- Sky Background -->
  <rect width="600" height="200" fill="#f7f7f7"/>
  
  <!-- Clouds -->
  <g class="cloud">
    <ellipse cx="50" cy="30" rx="30" ry="15" fill="#e8e8e8"/>
    <ellipse cx="70" cy="25" rx="25" ry="12" fill="#e8e8e8"/>
    <ellipse cx="30" cy="25" rx="20" ry="10" fill="#e8e8e8"/>
  </g>
  <g class="cloud" style="animation-delay: 2s;">
    <ellipse cx="200" cy="40" rx="25" ry="12" fill="#e8e8e8"/>
    <ellipse cx="220" cy="35" rx="20" ry="10" fill="#e8e8e8"/>
  </g>
  
  <!-- Ground -->
  <rect x="0" y="170" width="600" height="30" fill="#e0e0e0"/>
  <g class="ground">
    <rect x="0" y="170" width="100" height="2" fill="#d0d0d0"/>
    <rect x="200" y="170" width="100" height="2" fill="#d0d0d0"/>
    <rect x="400" y="170" width="100" height="2" fill="#d0d0d0"/>
  </g>
  
  <!-- Dino -->
  <g class="dino jumping">
    <!-- Body -->
    <rect x="50" y="130" width="30" height="30" rx="3" fill="#535353"/>
    <!-- Head -->
    <rect x="75" y="125" width="20" height="15" rx="3" fill="#535353"/>
    <!-- Eye -->
    <circle cx="85" cy="130" r="3" fill="white"/>
    <circle cx="86" cy="130" r="1.5" fill="#333"/>
    <!-- Legs -->
    <rect x="55" y="155" width="8" height="15" rx="2" fill="#535353"/>
    <rect x="67" y="155" width="8" height="15" rx="2" fill="#535353"/>
    <!-- Tail -->
    <polygon points="50,135 35,130 40,140" fill="#535353"/>
    <!-- Arm -->
    <rect x="70" y="140" width="4" height="10" rx="2" fill="#535353"/>
  </g>
  
  <!-- Cactus 1 -->
  <g class="cactus" style="animation-delay: 0.5s;">
    <rect x="550" y="145" width="10" height="25" rx="3" fill="#4CAF50"/>
    <rect x="547" y="150" width="8" height="15" rx="2" fill="#4CAF50"/>
    <rect x="555" y="148" width="8" height="12" rx="2" fill="#4CAF50"/>
  </g>
  
  <!-- Cactus 2 -->
  <g class="cactus" style="animation-delay: 1.5s;">
    <rect x="550" y="150" width="8" height="20" rx="3" fill="#4CAF50"/>
  </g>
  
  <!-- Pterodactyl -->
  <g class="ptera" style="animation-delay: 1s;">
    <ellipse cx="550" cy="90" rx="15" ry="8" fill="#666"/>
    <polygon points="560,85 575,80 565,90" fill="#666"/>
    <circle cx="545" cy="88" r="2" fill="white"/>
  </g>
  
  <!-- Score -->
  <text x="520" y="30" font-family="monospace" font-size="16" fill="#535353">🏆 0000</text>
  <text x="520" y="50" font-family="monospace" font-size="12" fill="#8e8e93">HI 0000</text>
  
  <!-- Game Over Text (subtle) -->
  <text x="200" y="100" font-family="monospace" font-size="14" fill="#8e8e93" opacity="0.3">
    ⬆️ Press Space to Jump
  </text>
</svg>
