<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="50%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FFEC8B"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
    
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B6B"/>
      <stop offset="50%" style="stop-color:#FF8E8E"/>
      <stop offset="100%" style="stop-color:#FF6B6B"/>
    </linearGradient>
    
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ECDC4"/>
      <stop offset="50%" style="stop-color:#6EE7DE"/>
      <stop offset="100%" style="stop-color:#4ECDC4"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes f1 {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        25% { transform: translateY(-20px) rotate(3deg); }
        75% { transform: translateY(-10px) rotate(-3deg); }
      }
      @keyframes f2 {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        30% { transform: translateY(-15px) rotate(-4deg); }
        70% { transform: translateY(-8px) rotate(4deg); }
      }
      @keyframes f3 {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(0deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.1; }
      }
      
      .a1 { animation: f1 4s ease-in-out infinite; }
      .a2 { animation: f2 3.5s ease-in-out infinite; }
      .a3 { animation: f3 3s ease-in-out infinite; }
      .p { animation: pulse 3s ease-in-out infinite; }
    </style>
  </defs>
  
  <rect width="900" height="160" fill="url(#bg)" rx="12"/>
  
  <!-- Subtle glow -->
  <circle cx="450" cy="80" r="120" fill="#FFD700" opacity="0.03" class="p"/>
  <circle cx="200" cy="80" r="80" fill="#FF6B6B" opacity="0.02" class="p" style="animation-delay: 1s;"/>
  <circle cx="700" cy="80" r="80" fill="#4ECDC4" opacity="0.02" class="p" style="animation-delay: 2s;"/>
  
  <!-- Row 1 - Big icons -->
  <g class="a1">
    <text x="60" y="55" font-family="monospace" font-size="40" fill="url(#g1)" font-weight="bold" filter="url(#glow)">&lt;/&gt;</text>
  </g>
  <g class="a2" style="animation-delay: 0.6s;">
    <text x="210" y="45" font-family="monospace" font-size="34" fill="url(#g2)" font-weight="bold">{ }</text>
  </g>
  <g class="a1" style="animation-delay: 1.2s;">
    <text x="370" y="55" font-family="monospace" font-size="36" fill="url(#g3)" font-weight="bold">[ ]</text>
  </g>
  <g class="a2" style="animation-delay: 0.9s;">
    <text x="530" y="50" font-family="monospace" font-size="42" fill="url(#g1)" font-weight="bold" filter="url(#glow)">( )</text>
  </g>
  <g class="a1" style="animation-delay: 1.5s;">
    <text x="700" y="55" font-family="monospace" font-size="34" fill="url(#g2)" font-weight="bold">#</text>
  </g>
  <g class="a2" style="animation-delay: 0.4s;">
    <text x="830" y="45" font-family="monospace" font-size="36" fill="url(#g3)" font-weight="bold">$</text>
  </g>
  
  <!-- Row 2 - Medium icons -->
  <g class="a3" style="animation-delay: 0.3s;">
    <text x="120" y="105" font-family="monospace" font-size="24" fill="url(#g3)" opacity="0.7">★</text>
  </g>
  <g class="a3" style="animation-delay: 0.9s;">
    <text x="280" y="98" font-family="monospace" font-size="22" fill="url(#g1)" opacity="0.7">◈</text>
  </g>
  <g class="a3" style="animation-delay: 1.5s;">
    <text x="440" y="108" font-family="monospace" font-size="26" fill="url(#g2)" opacity="0.7">✦</text>
  </g>
  <g class="a3" style="animation-delay: 0.6s;">
    <text x="600" y="100" font-family="monospace" font-size="24" fill="url(#g3)" opacity="0.7">⌘</text>
  </g>
  <g class="a3" style="animation-delay: 1.2s;">
    <text x="760" y="105" font-family="monospace" font-size="22" fill="url(#g1)" opacity="0.7">◆</text>
  </g>
  
  <!-- Row 3 - Small icons -->
  <g class="a3" style="animation-delay: 0.5s;">
    <text x="30" y="145" font-family="monospace" font-size="16" fill="#FFD700" opacity="0.3">+</text>
  </g>
  <g class="a3" style="animation-delay: 1.1s;">
    <text x="130" y="138" font-family="monospace" font-size="18" fill="#FF6B6B" opacity="0.3">-</text>
  </g>
  <g class="a3" style="animation-delay: 0.7s;">
    <text x="240" y="145" font-family="monospace" font-size="14" fill="#4ECDC4" opacity="0.3">=</text>
  </g>
  <g class="a3" style="animation-delay: 1.3s;">
    <text x="350" y="138" font-family="monospace" font-size="18" fill="#FFD700" opacity="0.3">&gt;</text>
  </g>
  <g class="a3" style="animation-delay: 0.4s;">
    <text x="460" y="145" font-family="monospace" font-size="16" fill="#FF6B6B" opacity="0.3">&lt;</text>
  </g>
  <g class="a3" style="animation-delay: 1.0s;">
    <text x="570" y="138" font-family="monospace" font-size="18" fill="#4ECDC4" opacity="0.3">/</text>
  </g>
  <g class="a3" style="animation-delay: 0.8s;">
    <text x="680" y="145" font-family="monospace" font-size="16" fill="#FFD700" opacity="0.3">\</text>
  </g>
  <g class="a3" style="animation-delay: 1.4s;">
    <text x="790" y="138" font-family="monospace" font-size="18" fill="#FF6B6B" opacity="0.3">|</text>
  </g>
  
  <!-- Premium corner accents -->
  <rect x="15" y="15" width="25" height="2" rx="1" fill="#FFD700" opacity="0.2"/>
  <rect x="15" y="15" width="2" height="18" rx="1" fill="#FFD700" opacity="0.2"/>
  <rect x="860" y="15" width="25" height="2" rx="1" fill="#FFD700" opacity="0.2"/>
  <rect x="883" y="15" width="2" height="18" rx="1" fill="#FFD700" opacity="0.2"/>
  <rect x="15" y="143" width="25" height="2" rx="1" fill="#FFD700" opacity="0.2"/>
  <rect x="15" y="127" width="2" height="18" rx="1" fill="#FFD700" opacity="0.2"/>
  <rect x="860" y="143" width="25" height="2" rx="1" fill="#FFD700" opacity="0.2"/>
  <rect x="883" y="127" width="2" height="18" rx="1" fill="#FFD700" opacity="0.2"/>
</svg>
