<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f7971e"/>
      <stop offset="100%" style="stop-color:#ffd200"/>
    </linearGradient>
    
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f260"/>
      <stop offset="100%" style="stop-color:#0575e6"/>
    </linearGradient>
    
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f12711"/>
      <stop offset="100%" style="stop-color:#f5af19"/>
    </linearGradient>
    
    <!-- Glow Filters -->
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <style>
      @keyframes floatUp {
        0% { transform: translateY(0) scale(1); opacity: 0.6; }
        50% { transform: translateY(-20px) scale(1.1); opacity: 1; }
        100% { transform: translateY(0) scale(1); opacity: 0.6; }
      }
      
      @keyframes floatDown {
        0% { transform: translateY(0) scale(1); opacity: 0.6; }
        50% { transform: translateY(20px) scale(1.1); opacity: 1; }
        100% { transform: translateY(0) scale(1); opacity: 0.6; }
      }
      
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.1); }
      }
      
      @keyframes spinSlow {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      @keyframes spinReverse {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      
      @keyframes dash {
        to { stroke-dashoffset: 0; }
      }
      
      @keyframes fadeInOut {
        0%, 100% { opacity: 0; transform: translateX(-20px); }
        20% { opacity: 1; transform: translateX(0); }
        80% { opacity: 1; transform: translateX(0); }
        100% { opacity: 0; transform: translateX(20px); }
      }
      
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.5); }
        50% { opacity: 1; transform: scale(1); }
      }
      
      @keyframes wave {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      
      @keyframes shimmerText {
        0% { background-position: -200% center; }
        100% { background-position: 200% center; }
      }
      
      @keyframes orbitPulse {
        0%, 100% { r: 3; opacity: 0.8; }
        50% { r: 6; opacity: 0.3; }
      }
      
      .float-up { animation: floatUp 3s ease-in-out infinite; }
      .float-down { animation: floatDown 3.5s ease-in-out infinite; }
      .pulse-glow { animation: pulseGlow 2s ease-in-out infinite; }
      .spin-slow { animation: spinSlow 10s linear infinite; }
      .spin-reverse { animation: spinReverse 10s linear infinite; }
      .twinkle { animation: twinkle 2s ease-in-out infinite; }
      .wave { animation: wave 2s ease-in-out infinite; }
      .wave2 { animation: wave 2s ease-in-out infinite 0.3s; }
      .wave3 { animation: wave 2s ease-in-out infinite 0.6s; }
      .shimmer-gold {
        background: linear-gradient(90deg, #f7971e, #ffd200, #f7971e);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shimmerText 3s linear infinite;
      }
      .shimmer-neon {
        background: linear-gradient(90deg, #00f260, #0575e6, #00f260);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shimmerText 3s linear infinite 1.5s;
      }
      
      .fade-text { animation: fadeInOut 5s ease-in-out infinite; }
      .fade-text2 { animation: fadeInOut 5s ease-in-out infinite 1.8s; }
      .fade-text3 { animation: fadeInOut 5s ease-in-out infinite 3.6s; }
      
      .orbit-dot {
        animation: orbitPulse 2s ease-in-out infinite;
      }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="250" fill="url(#bgGrad)" rx="16"/>
  
  <!-- Background Grid Pattern -->
  <g opacity="0.05">
    <line x1="0" y1="30" x2="800" y2="30" stroke="#00f260" stroke-width="0.5"/>
    <line x1="0" y1="60" x2="800" y2="60" stroke="#00f260" stroke-width="0.5"/>
    <line x1="0" y1="90" x2="800" y2="90" stroke="#00f260" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="800" y2="120" stroke="#00f260" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="800" y2="150" stroke="#00f260" stroke-width="0.5"/>
    <line x1="0" y1="180" x2="800" y2="180" stroke="#00f260" stroke-width="0.5"/>
    <line x1="0" y1="210" x2="800" y2="210" stroke="#00f260" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="800" y2="240" stroke="#00f260" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="250" stroke="#00f260" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="250" stroke="#00f260" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="250" stroke="#00f260" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="250" stroke="#00f260" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="250" stroke="#00f260" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="250" stroke="#00f260" stroke-width="0.5"/>
    <line x1="700" y1="0" x2="700" y2="250" stroke="#00f260" stroke-width="0.5"/>
  </g>
  
  <!-- Decorative Circles -->
  <circle cx="650" cy="125" r="100" fill="none" stroke="#00f260" stroke-width="0.5" opacity="0.1" class="spin-slow"/>
  <circle cx="650" cy="125" r="80" fill="none" stroke="#f7971e" stroke-width="0.5" opacity="0.1" class="spin-reverse"/>
  <circle cx="650" cy="125" r="60" fill="none" stroke="#f12711" stroke-width="0.5" opacity="0.1" class="spin-slow"/>
  
  <!-- Orbiting Dots -->
  <circle cx="650" cy="125" r="3" fill="#00f260" class="orbit-dot"/>
  <circle cx="650" cy="125" r="3" fill="#f7971e" class="orbit-dot" style="animation-delay: 0.5s;"/>
  <circle cx="650" cy="125" r="3" fill="#f12711" class="orbit-dot" style="animation-delay: 1s;"/>
  
  <!-- Central Avatar -->
  <g transform="translate(650, 125)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="35" fill="#1a1a2e" stroke="url(#neonGrad)" stroke-width="1.5"/>
    <text x="0" y="12" text-anchor="middle" font-size="32" fill="white">👨‍💻</text>
    
    <!-- Glowing ring -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#00f260" stroke-width="0.5" opacity="0.3" class="spin-slow"/>
  </g>
  
  <!-- Main Title with Gold Gradient -->
  <g transform="translate(50, 55)">
    <text x="0" y="0" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#00f260" opacity="0.6" letter-spacing="4">HELLO, I'M</text>
    <text x="0" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="48" font-weight="800" class="shimmer-gold">
      David Daniel
    </text>
    <text x="0" y="95" font-family="'Segoe UI', Arial, sans-serif" font-size="38" font-weight="700" class="shimmer-neon">
      Sepkitt
    </text>
  </g>
  
  <!-- Role Tags -->
  <g transform="translate(50, 145)">
    <!-- Decorative line -->
    <rect x="0" y="0" width="40" height="3" rx="1.5" fill="url(#goldGrad)"/>
    
    <text x="55" y="8" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#a0a0b0" class="fade-text">
      🚀 Aspiring Full Stack Developer
    </text>
    <text x="55" y="8" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#a0a0b0" class="fade-text2">
      💡 Building the future, one line at a time
    </text>
    <text x="55" y="8" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#a0a0b0" class="fade-text3">
      🌍 Cape Town, South Africa
    </text>
  </g>
  
  <!-- Tech Stack Pills -->
  <g transform="translate(50, 185)">
    <rect x="0" y="0" width="80" height="28" rx="14" fill="none" stroke="#00f260" stroke-width="1.5" opacity="0.4" class="float-up"/>
    <text x="40" y="19" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#00f260" font-weight="600">React</text>
    
    <rect x="90" y="0" width="70" height="28" rx="14" fill="none" stroke="#f7971e" stroke-width="1.5" opacity="0.4" class="float-down"/>
    <text x="125" y="19" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#f7971e" font-weight="600">Java</text>
    
    <rect x="170" y="0" width="95" height="28" rx="14" fill="none" stroke="#f12711" stroke-width="1.5" opacity="0.4" class="float-up"/>
    <text x="217" y="19" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#f12711" font-weight="600">JavaScript</text>
    
    <rect x="275" y="0" width="95" height="28" rx="14" fill="none" stroke="#00f260" stroke-width="1.5" opacity="0.4" class="float-down"/>
    <text x="322" y="19" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#00f260" font-weight="600">TypeScript</text>
    
    <rect x="380" y="0" width="80" height="28" rx="14" fill="none" stroke="#f7971e" stroke-width="1.5" opacity="0.4" class="float-up"/>
    <text x="420" y="19" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#f7971e" font-weight="600">Python</text>
    
    <rect x="470" y="0" width="90" height="28" rx="14" fill="none" stroke="#f12711" stroke-width="1.5" opacity="0.4" class="float-down"/>
    <text x="515" y="19" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#f12711" font-weight="600">Node.js</text>
  </g>
  
  <!-- Status Indicator -->
  <g transform="translate(680, 220)">
    <circle cx="0" cy="0" r="4" fill="#00f260">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="10" y="4" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#00f260" opacity="0.7">Available for opportunities</text>
  </g>
  
  <!-- Decorative Elements -->
  <!-- Top left corner -->
  <rect x="10" y="10" width="30" height="2" rx="1" fill="#00f260" opacity="0.4"/>
  <rect x="10" y="10" width="2" height="20" rx="1" fill="#00f260" opacity="0.4"/>
  
  <!-- Top right corner -->
  <rect x="760" y="10" width="30" height="2" rx="1" fill="#f7971e" opacity="0.4"/>
  <rect x="788" y="10" width="2" height="20" rx="1" fill="#f7971e" opacity="0.4"/>
  
  <!-- Bottom left corner -->
  <rect x="10" y="238" width="30" height="2" rx="1" fill="#f12711" opacity="0.4"/>
  <rect x="10" y="220" width="2" height="20" rx="1" fill="#f12711" opacity="0.4"/>
  
  <!-- Bottom right corner -->
  <rect x="760" y="238" width="30" height="2" rx="1" fill="#00f260" opacity="0.4"/>
  <rect x="788" y="220" width="2" height="20" rx="1" fill="#00f260" opacity="0.4"/>
  
  <!-- Floating Code Symbols -->
  <text x="720" y="40" font-family="monospace" font-size="12" fill="#00f260" opacity="0.15" class="float-up">{ }</text>
  <text x="30" y="220" font-family="monospace" font-size="12" fill="#f7971e" opacity="0.15" class="float-down">()</text>
  <text x="750" y="210" font-family="monospace" font-size="12" fill="#f12711" opacity="0.15" class="float-up">[]</text>
  
  <!-- Subtle wave lines at bottom -->
  <path d="M0 240 Q50 232 100 240 Q150 248 200 240 Q250 232 300 240 Q350 248 400 240 Q450 232 500 240 Q550 248 600 240 Q650 232 700 240 Q750 248 800 240" stroke="#00f260" stroke-width="0.5" opacity="0.1" fill="none"/>
</svg>
