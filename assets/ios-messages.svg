<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <!-- Dark Black Background -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000"/>
      <stop offset="50%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#000000"/>
    </linearGradient>
    
    <!-- Golden Gradients -->
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FFED4A"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
    
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFC107"/>
      <stop offset="50%" style="stop-color:#FFD54F"/>
      <stop offset="100%" style="stop-color:#FFC107"/>
    </linearGradient>
    
    <linearGradient id="gold3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFB300"/>
      <stop offset="50%" style="stop-color:#FFCA28"/>
      <stop offset="100%" style="stop-color:#FFB300"/>
    </linearGradient>

    <!-- Golden Glow Filters -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="trailGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      /* Shooting star animations */
      @keyframes shoot1 {
        0% { transform: translateX(-120px) translateY(-30px) rotate(-30deg); opacity: 0; }
        8% { opacity: 1; }
        20% { transform: translateX(350px) translateY(20px) rotate(-30deg); opacity: 1; }
        25% { opacity: 0; }
        100% { opacity: 0; }
      }
      
      @keyframes shoot2 {
        0% { transform: translateX(-80px) translateY(40px) rotate(-25deg); opacity: 0; }
        12% { opacity: 1; }
        28% { transform: translateX(500px) translateY(80px) rotate(-25deg); opacity: 1; }
        33% { opacity: 0; }
        100% { opacity: 0; }
      }
      
      @keyframes shoot3 {
        0% { transform: translateX(950px) translateY(-20px) rotate(150deg); opacity: 0; }
        18% { opacity: 1; }
        35% { transform: translateX(450px) translateY(30px) rotate(150deg); opacity: 1; }
        40% { opacity: 0; }
        100% { opacity: 0; }
      }
      
      @keyframes shoot4 {
        0% { transform: translateX(980px) translateY(50px) rotate(135deg); opacity: 0; }
        22% { opacity: 1; }
        42% { transform: translateX(400px) translateY(100px) rotate(135deg); opacity: 1; }
        47% { opacity: 0; }
        100% { opacity: 0; }
      }
      
      @keyframes shoot5 {
        0% { transform: translateX(-150px) translateY(80px) rotate(-20deg); opacity: 0; }
        30% { opacity: 1; }
        50% { transform: translateX(600px) translateY(120px) rotate(-20deg); opacity: 1; }
        55% { opacity: 0; }
        100% { opacity: 0; }
      }
      
      /* Twinkling stars */
      @keyframes twinkle {
        0%, 100% { opacity: 0.15; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.3); }
      }
      
      @keyframes twinkleSlow {
        0%, 100% { opacity: 0.1; }
        50% { opacity: 0.4; }
      }
      
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.08; transform: scale(1); }
        50% { opacity: 0.2; transform: scale(1.2); }
      }
      
      .shoot1 { animation: shoot1 7s ease-in-out infinite; }
      .shoot2 { animation: shoot2 9s ease-in-out infinite; }
      .shoot3 { animation: shoot3 8s ease-in-out infinite; }
      .shoot4 { animation: shoot4 10s ease-in-out infinite; }
      .shoot5 { animation: shoot5 11s ease-in-out infinite; }
      
      .twinkle { animation: twinkle 2.5s ease-in-out infinite; }
      .twinkleSlow { animation: twinkleSlow 4s ease-in-out infinite; }
      .float { animation: float 3s ease-in-out infinite; }
      .pulse { animation: pulseGlow 5s ease-in-out infinite; }
    </style>
  </defs>
  
  <!-- Pure Black Background -->
  <rect width="900" height="200" fill="url(#sky)" rx="12"/>
  
  <!-- Subtle Golden Glow Orbs -->
  <circle cx="200" cy="80" r="80" fill="#FFD700" opacity="0.04" class="pulse"/>
  <circle cx="450" cy="100" r="100" fill="#FFD700" opacity="0.03" class="pulse" style="animation-delay: 2s;"/>
  <circle cx="700" cy="60" r="80" fill="#FFD700" opacity="0.04" class="pulse" style="animation-delay: 3.5s;"/>
  
  <!-- Background Stars - Small white dots -->
  <circle cx="30" cy="25" r="1.5" fill="white" class="twinkle"/>
  <circle cx="120" cy="55" r="1" fill="white" class="twinkle" style="animation-delay: 0.5s;"/>
  <circle cx="230" cy="15" r="1.5" fill="white" class="twinkle" style="animation-delay: 1s;"/>
  <circle cx="340" cy="45" r="1" fill="white" class="twinkle" style="animation-delay: 1.5s;"/>
  <circle cx="460" cy="20" r="1.5" fill="white" class="twinkle" style="animation-delay: 0.8s;"/>
  <circle cx="560" cy="50" r="1" fill="white" class="twinkle" style="animation-delay: 0.3s;"/>
  <circle cx="670" cy="30" r="1.5" fill="white" class="twinkle" style="animation-delay: 1.2s;"/>
  <circle cx="780" cy="40" r="1" fill="white" class="twinkle" style="animation-delay: 0.7s;"/>
  <circle cx="870" cy="25" r="1.5" fill="white" class="twinkle" style="animation-delay: 0.9s;"/>
  
  <circle cx="70" cy="145" r="1" fill="white" class="twinkle" style="animation-delay: 1.3s;"/>
  <circle cx="190" cy="135" r="1.5" fill="white" class="twinkle" style="animation-delay: 0.4s;"/>
  <circle cx="310" cy="150" r="1" fill="white" class="twinkle" style="animation-delay: 1.1s;"/>
  <circle cx="430" cy="140" r="1.5" fill="white" class="twinkle" style="animation-delay: 0.6s;"/>
  <circle cx="550" cy="155" r="1" fill="white" class="twinkle" style="animation-delay: 1.4s;"/>
  <circle cx="680" cy="145" r="1.5" fill="white" class="twinkle" style="animation-delay: 0.2s;"/>
  <circle cx="800" cy="150" r="1" fill="white" class="twinkle" style="animation-delay: 0.9s;"/>
  
  <!-- ===== SHOOTING STARS - GOLDEN CODE ICONS ===== -->
  
  <!-- Shooting Star 1 - &lt;/&gt; -->
  <g class="shoot1">
    <!-- Trail -->
    <line x1="-30" y1="10" x2="-120" y2="35" stroke="#FFD700" stroke-width="2.5" opacity="0.4" filter="url(#trailGlow)"/>
    <line x1="-30" y1="10" x2="-80" y2="25" stroke="#FFD700" stroke-width="1.5" opacity="0.3"/>
    <line x1="-30" y1="10" x2="-50" y2="18" stroke="#FFD700" stroke-width="1" opacity="0.2"/>
    <!-- Icon -->
    <text x="0" y="0" font-family="monospace" font-size="30" fill="url(#gold1)" font-weight="bold" filter="url(#glow)">&lt;/&gt;</text>
  </g>
  
  <!-- Shooting Star 2 - { } -->
  <g class="shoot2">
    <line x1="-25" y1="10" x2="-100" y2="30" stroke="#FFC107" stroke-width="2.5" opacity="0.4" filter="url(#trailGlow)"/>
    <line x1="-25" y1="10" x2="-65" y2="22" stroke="#FFC107" stroke-width="1.5" opacity="0.3"/>
    <line x1="-25" y1="10" x2="-40" y2="16" stroke="#FFC107" stroke-width="1" opacity="0.2"/>
    <text x="0" y="0" font-family="monospace" font-size="26" fill="url(#gold2)" font-weight="bold" filter="url(#softGlow)">{ }</text>
  </g>
  
  <!-- Shooting Star 3 - [ ] (going left) -->
  <g class="shoot3">
    <line x1="25" y1="10" x2="100" y2="30" stroke="#FFD54F" stroke-width="2.5" opacity="0.4" filter="url(#trailGlow)"/>
    <line x1="25" y1="10" x2="65" y2="22" stroke="#FFD54F" stroke-width="1.5" opacity="0.3"/>
    <line x1="25" y1="10" x2="40" y2="16" stroke="#FFD54F" stroke-width="1" opacity="0.2"/>
    <text x="0" y="0" font-family="monospace" font-size="28" fill="url(#gold3)" font-weight="bold" filter="url(#softGlow)">[ ]</text>
  </g>
  
  <!-- Shooting Star 4 - ( ) -->
  <g class="shoot4">
    <line x1="20" y1="10" x2="80" y2="28" stroke="#FFD700" stroke-width="2.5" opacity="0.4" filter="url(#trailGlow)"/>
    <line x1="20" y1="10" x2="55" y2="20" stroke="#FFD700" stroke-width="1.5" opacity="0.3"/>
    <line x1="20" y1="10" x2="35" y2="15" stroke="#FFD700" stroke-width="1" opacity="0.2"/>
    <text x="0" y="0" font-family="monospace" font-size="24" fill="url(#gold1)" font-weight="bold" filter="url(#softGlow)">( )</text>
  </g>
  
  <!-- Shooting Star 5 - # -->
  <g class="shoot5">
    <line x1="-20" y1="10" x2="-90" y2="30" stroke="#FFC107" stroke-width="2.5" opacity="0.4" filter="url(#trailGlow)"/>
    <line x1="-20" y1="10" x2="-60" y2="22" stroke="#FFC107" stroke-width="1.5" opacity="0.3"/>
    <line x1="-20" y1="10" x2="-35" y2="16" stroke="#FFC107" stroke-width="1" opacity="0.2"/>
    <text x="0" y="0" font-family="monospace" font-size="26" fill="url(#gold2)" font-weight="bold" filter="url(#softGlow)">#</text>
  </g>
  
  <!-- Floating Golden Stars -->
  <g class="float" style="animation-delay: 0.5s;">
    <text x="100" y="100" font-family="monospace" font-size="18" fill="#FFD700" opacity="0.3" filter="url(#softGlow)">✦</text>
  </g>
  <g class="float" style="animation-delay: 1.2s;">
    <text x="250" y="85" font-family="monospace" font-size="16" fill="#FFD700" opacity="0.25">◈</text>
  </g>
  <g class="float" style="animation-delay: 0.8s;">
    <text x="400" y="95" font-family="monospace" font-size="20" fill="#FFD700" opacity="0.3" filter="url(#softGlow)">★</text>
  </g>
  <g class="float" style="animation-delay: 1.5s;">
    <text x="550" y="88" font-family="monospace" font-size="18" fill="#FFD700" opacity="0.25">⌘</text>
  </g>
  <g class="float" style="animation-delay: 0.3s;">
    <text x="700" y="98" font-family="monospace" font-size="16" fill="#FFD700" opacity="0.3">◆</text>
  </g>
  <g class="float" style="animation-delay: 1.0s;">
    <text x="820" y="90" font-family="monospace" font-size="18" fill="#FFD700" opacity="0.25" filter="url(#softGlow)">✦</text>
  </g>
  
  <!-- Small Golden Symbols -->
  <g class="float" style="animation-delay: 0.6s;">
    <text x="50" y="155" font-family="monospace" font-size="12" fill="#FFD700" opacity="0.15">+</text>
  </g>
  <g class="float" style="animation-delay: 1.3s;">
    <text x="180" y="148" font-family="monospace" font-size="14" fill="#FFD700" opacity="0.12">-</text>
  </g>
  <g class="float" style="animation-delay: 0.4s;">
    <text x="320" y="155" font-family="monospace" font-size="12" fill="#FFD700" opacity="0.15">=</text>
  </g>
  <g class="float" style="animation-delay: 1.1s;">
    <text x="460" y="148" font-family="monospace" font-size="14" fill="#FFD700" opacity="0.12">&gt;</text>
  </g>
  <g class="float" style="animation-delay: 0.7s;">
    <text x="600" y="155" font-family="monospace" font-size="12" fill="#FFD700" opacity="0.15">&lt;</text>
  </g>
  <g class="float" style="animation-delay: 1.4s;">
    <text x="740" y="148" font-family="monospace" font-size="14" fill="#FFD700" opacity="0.12">/</text>
  </g>
  <g class="float" style="animation-delay: 0.9s;">
    <text x="870" y="155" font-family="monospace" font-size="12" fill="#FFD700" opacity="0.15">\</text>
  </g>
  
  <!-- Subtle Corner Accents -->
  <rect x="12" y="12" width="20" height="2" rx="1" fill="#FFD700" opacity="0.15"/>
  <rect x="12" y="12" width="2" height="15" rx="1" fill="#FFD700" opacity="0.15"/>
  <rect x="868" y="12" width="20" height="2" rx="1" fill="#FFD700" opacity="0.15"/>
  <rect x="886" y="12" width="2" height="15" rx="1" fill="#FFD700" opacity="0.15"/>
  <rect x="12" y="186" width="20" height="2" rx="1" fill="#FFD700" opacity="0.15"/>
  <rect x="12" y="173" width="2" height="15" rx="1" fill="#FFD700" opacity="0.15"/>
  <rect x="868" y="186" width="20" height="2" rx="1" fill="#FFD700" opacity="0.15"/>
  <rect x="886" y="173" width="2" height="15" rx="1" fill="#FFD700" opacity="0.15"/>
</svg>
