<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <!-- Night Sky Gradient -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2a"/>
      <stop offset="50%" style="stop-color:#1a0a3e"/>
      <stop offset="100%" style="stop-color:#0a0a2a"/>
    </linearGradient>
    
    <!-- Star Colors -->
    <linearGradient id="star1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FFF8DC"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
    
    <linearGradient id="star2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B6B"/>
      <stop offset="50%" style="stop-color:#FF8E8E"/>
      <stop offset="100%" style="stop-color:#FF6B6B"/>
    </linearGradient>
    
    <linearGradient id="star3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ECDC4"/>
      <stop offset="50%" style="stop-color:#6EE7DE"/>
      <stop offset="100%" style="stop-color:#4ECDC4"/>
    </linearGradient>
    
    <linearGradient id="star4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#A8E6CF"/>
      <stop offset="50%" style="stop-color:#D4F1E6"/>
      <stop offset="100%" style="stop-color:#A8E6CF"/>
    </linearGradient>

    <!-- Glow for stars -->
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      /* Shooting star animation */
      @keyframes shootStar1 {
        0% { transform: translateX(-100px) translateY(-50px) rotate(-35deg); opacity: 0; }
        5% { opacity: 1; }
        15% { transform: translateX(300px) translateY(-20px) rotate(-35deg); opacity: 1; }
        20% { opacity: 0; }
        100% { opacity: 0; }
      }
      
      @keyframes shootStar2 {
        0% { transform: translateX(-200px) translateY(50px) rotate(-30deg); opacity: 0; }
        10% { opacity: 1; }
        25% { transform: translateX(400px) translateY(80px) rotate(-30deg); opacity: 1; }
        30% { opacity: 0; }
        100% { opacity: 0; }
      }
      
      @keyframes shootStar3 {
        0% { transform: translateX(800px) translateY(-30px) rotate(150deg); opacity: 0; }
        15% { opacity: 1; }
        30% { transform: translateX(400px) translateY(20px) rotate(150deg); opacity: 1; }
        35% { opacity: 0; }
        100% { opacity: 0; }
      }
      
      @keyframes shootStar4 {
        0% { transform: translateX(900px) translateY(60px) rotate(140deg); opacity: 0; }
        20% { opacity: 1; }
        40% { transform: translateX(500px) translateY(100px) rotate(140deg); opacity: 1; }
        45% { opacity: 0; }
        100% { opacity: 0; }
      }
      
      /* Floating stars */
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.2); }
      }
      
      @keyframes floatStar {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      
      @keyframes slowDrift {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50px); }
      }
      
      @keyframes cometTrail {
        0% { opacity: 0; }
        10% { opacity: 0.8; }
        100% { opacity: 0; }
      }
      
      .shoot1 { animation: shootStar1 6s ease-in-out infinite; }
      .shoot2 { animation: shootStar2 8s ease-in-out infinite; }
      .shoot3 { animation: shootStar3 7s ease-in-out infinite; }
      .shoot4 { animation: shootStar4 9s ease-in-out infinite; }
      .twinkle { animation: twinkle 2s ease-in-out infinite; }
      .float { animation: floatStar 3s ease-in-out infinite; }
      .drift { animation: slowDrift 10s linear infinite; }
    </style>
  </defs>
  
  <!-- Night Sky Background -->
  <rect width="900" height="200" fill="url(#sky)" rx="12"/>
  
  <!-- Background Stars (small dots) -->
  <circle cx="50" cy="30" r="1.5" fill="white" opacity="0.3" class="twinkle"/>
  <circle cx="150" cy="60" r="1" fill="white" opacity="0.2" class="twinkle" style="animation-delay: 0.5s;"/>
  <circle cx="250" cy="20" r="1.5" fill="white" opacity="0.3" class="twinkle" style="animation-delay: 1s;"/>
  <circle cx="350" cy="50" r="1" fill="white" opacity="0.2" class="twinkle" style="animation-delay: 1.5s;"/>
  <circle cx="450" cy="25" r="1.5" fill="white" opacity="0.3" class="twinkle" style="animation-delay: 0.8s;"/>
  <circle cx="550" cy="55" r="1" fill="white" opacity="0.2" class="twinkle" style="animation-delay: 0.3s;"/>
  <circle cx="650" cy="35" r="1.5" fill="white" opacity="0.3" class="twinkle" style="animation-delay: 1.2s;"/>
  <circle cx="750" cy="45" r="1" fill="white" opacity="0.2" class="twinkle" style="animation-delay: 0.7s;"/>
  <circle cx="850" cy="30" r="1.5" fill="white" opacity="0.3" class="twinkle" style="animation-delay: 0.9s;"/>
  
  <circle cx="80" cy="140" r="1" fill="white" opacity="0.2" class="twinkle" style="animation-delay: 1.3s;"/>
  <circle cx="220" cy="130" r="1.5" fill="white" opacity="0.3" class="twinkle" style="animation-delay: 0.4s;"/>
  <circle cx="380" cy="145" r="1" fill="white" opacity="0.2" class="twinkle" style="animation-delay: 1.1s;"/>
  <circle cx="520" cy="135" r="1.5" fill="white" opacity="0.3" class="twinkle" style="animation-delay: 0.6s;"/>
  <circle cx="680" cy="150" r="1" fill="white" opacity="0.2" class="twinkle" style="animation-delay: 1.4s;"/>
  <circle cx="820" cy="140" r="1.5" fill="white" opacity="0.3" class="twinkle" style="animation-delay: 0.2s;"/>
  
  <!-- SHOOTING STARS - Code Icons -->
  
  <!-- Shooting Star 1 - Gold -->
  <g class="shoot1">
    <text x="0" y="0" font-family="monospace" font-size="28" fill="url(#star1)" font-weight="bold" filter="url(#starGlow)">&lt;/&gt;</text>
    <!-- Trail -->
    <line x1="-20" y1="10" x2="-80" y2="30" stroke="#FFD700" stroke-width="2" opacity="0.3"/>
    <line x1="-20" y1="10" x2="-60" y2="25" stroke="#FFD700" stroke-width="1" opacity="0.2"/>
  </g>
  
  <!-- Shooting Star 2 - Coral -->
  <g class="shoot2">
    <text x="0" y="0" font-family="monospace" font-size="24" fill="url(#star2)" font-weight="bold" filter="url(#softGlow)">{ }</text>
    <line x1="-15" y1="10" x2="-70" y2="25" stroke="#FF6B6B" stroke-width="2" opacity="0.3"/>
    <line x1="-15" y1="10" x2="-50" y2="20" stroke="#FF6B6B" stroke-width="1" opacity="0.2"/>
  </g>
  
  <!-- Shooting Star 3 - Teal (going left) -->
  <g class="shoot3">
    <text x="0" y="0" font-family="monospace" font-size="26" fill="url(#star3)" font-weight="bold" filter="url(#softGlow)">[ ]</text>
    <line x1="25" y1="10" x2="80" y2="25" stroke="#4ECDC4" stroke-width="2" opacity="0.3"/>
    <line x1="25" y1="10" x2="60" y2="20" stroke="#4ECDC4" stroke-width="1" opacity="0.2"/>
  </g>
  
  <!-- Shooting Star 4 - Mint -->
  <g class="shoot4">
    <text x="0" y="0" font-family="monospace" font-size="22" fill="url(#star4)" font-weight="bold" filter="url(#softGlow)">( )</text>
    <line x1="20" y1="10" x2="75" y2="25" stroke="#A8E6CF" stroke-width="2" opacity="0.3"/>
    <line x1="20" y1="10" x2="55" y2="20" stroke="#A8E6CF" stroke-width="1" opacity="0.2"/>
  </g>
  
  <!-- Floating Stars (Static code icons that twinkle) -->
  <g class="float" style="animation-delay: 0.5s;">
    <text x="100" y="100" font-family="monospace" font-size="18" fill="url(#star1)" opacity="0.4">✦</text>
  </g>
  <g class="float" style="animation-delay: 1.2s;">
    <text x="250" y="85" font-family="monospace" font-size="16" fill="url(#star2)" opacity="0.3">◈</text>
  </g>
  <g class="float" style="animation-delay: 0.8s;">
    <text x="400" y="95" font-family="monospace" font-size="20" fill="url(#star3)" opacity="0.4">★</text>
  </g>
  <g class="float" style="animation-delay: 1.5s;">
    <text x="550" y="88" font-family="monospace" font-size="18" fill="url(#star4)" opacity="0.3">⌘</text>
  </g>
  <g class="float" style="animation-delay: 0.3s;">
    <text x="700" y="98" font-family="monospace" font-size="16" fill="url(#star1)" opacity="0.4">◆</text>
  </g>
  <g class="float" style="animation-delay: 1.0s;">
    <text x="820" y="90" font-family="monospace" font-size="18" fill="url(#star2)" opacity="0.3">✦</text>
  </g>
  
  <!-- Small floating symbols -->
  <g class="float" style="animation-delay: 0.6s;">
    <text x="50" y="155" font-family="monospace" font-size="12" fill="#FFD700" opacity="0.2">+</text>
  </g>
  <g class="float" style="animation-delay: 1.3s;">
    <text x="180" y="148" font-family="monospace" font-size="14" fill="#FF6B6B" opacity="0.2">-</text>
  </g>
  <g class="float" style="animation-delay: 0.4s;">
    <text x="320" y="155" font-family="monospace" font-size="12" fill="#4ECDC4" opacity="0.2">=</text>
  </g>
  <g class="float" style="animation-delay: 1.1s;">
    <text x="460" y="148" font-family="monospace" font-size="14" fill="#A8E6CF" opacity="0.2">&gt;</text>
  </g>
  <g class="float" style="animation-delay: 0.7s;">
    <text x="600" y="155" font-family="monospace" font-size="12" fill="#FFD700" opacity="0.2">&lt;</text>
  </g>
  <g class="float" style="animation-delay: 1.4s;">
    <text x="740" y="148" font-family="monospace" font-size="14" fill="#FF6B6B" opacity="0.2">/</text>
  </g>
  <g class="float" style="animation-delay: 0.9s;">
    <text x="870" y="155" font-family="monospace" font-size="12" fill="#4ECDC4" opacity="0.2">\</text>
  </g>
  
  <!-- Shooting Star Trails (decorative) -->
  <g opacity="0.05">
    <line x1="50" y1="20" x2="200" y2="40" stroke="#FFD700" stroke-width="1"/>
    <line x1="300" y1="15" x2="400" y2="30" stroke="#FF6B6B" stroke-width="1"/>
    <line x1="600" y1="25" x2="750" y2="35" stroke="#4ECDC4" stroke-width="1"/>
  </g>
  
  <!-- Corner Accents - Subtle -->
  <rect x="12" y="12" width="20" height="2" rx="1" fill="#FFD700" opacity="0.15"/>
  <rect x="12" y="12" width="2" height="15" rx="1" fill="#FFD700" opacity="0.15"/>
  <rect x="868" y="12" width="20" height="2" rx="1" fill="#FFD700" opacity="0.15"/>
  <rect x="886" y="12" width="2" height="15" rx="1" fill="#FFD700" opacity="0.15"/>
  <rect x="12" y="186" width="20" height="2" rx="1" fill="#FFD700" opacity="0.15"/>
  <rect x="12" y="173" width="2" height="15" rx="1" fill="#FFD700" opacity="0.15"/>
  <rect x="868" y="186" width="20" height="2" rx="1" fill="#FFD700" opacity="0.15"/>
  <rect x="886" y="173" width="2" height="15" rx="1" fill="#FFD700" opacity="0.15"/>
</svg>
