<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#0f0c29"/>
    </linearGradient>
    
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#007AFF"/>
    </linearGradient>
    
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7B2FBE"/>
      <stop offset="100%" style="stop-color:#9B59B6"/>
    </linearGradient>
    
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B8A"/>
      <stop offset="100%" style="stop-color:#FF2D55"/>
    </linearGradient>
    
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00F260"/>
      <stop offset="100%" style="stop-color:#0575E6"/>
    </linearGradient>
    
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F7971E"/>
      <stop offset="100%" style="stop-color:#FFD200"/>
    </linearGradient>

    <style>
      /* Floating Animations */
      @keyframes float1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(5deg); }
      }
      
      @keyframes float2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-15px) rotate(-5deg); }
      }
      
      @keyframes float3 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-25px) rotate(3deg); }
      }
      
      @keyframes float4 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-18px) rotate(-3deg); }
      }
      
      @keyframes float5 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-22px) rotate(6deg); }
      }
      
      @keyframes float6 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(-4deg); }
      }
      
      @keyframes float7 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-28px) rotate(4deg); }
      }
      
      @keyframes float8 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-16px) rotate(-6deg); }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }
      
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.8; }
      }
      
      @keyframes slideUp {
        0% { opacity: 0; transform: translateY(20px); }
        20% { opacity: 1; transform: translateY(0); }
        80% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-20px); }
      }
      
      @keyframes shimmer {
        0% { background-position: -200% center; }
        100% { background-position: 200% center; }
      }
      
      .float1 { animation: float1 4s ease-in-out infinite; }
      .float2 { animation: float2 3.5s ease-in-out infinite; }
      .float3 { animation: float3 4.5s ease-in-out infinite; }
      .float4 { animation: float4 3.8s ease-in-out infinite; }
      .float5 { animation: float5 4.2s ease-in-out infinite; }
      .float6 { animation: float6 3.2s ease-in-out infinite; }
      .float7 { animation: float7 4.8s ease-in-out infinite; }
      .float8 { animation: float8 3.6s ease-in-out infinite; }
      
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .twinkle { animation: twinkle 3s ease-in-out infinite; }
      
      .shimmer-text {
        background: linear-gradient(90deg, #00D4FF, #7B2FBE, #FF6B8A, #00D4FF);
        background-size: 300% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shimmer 4s linear infinite;
      }
      
      .slide-text { animation: slideUp 5s ease-in-out infinite; }
      .slide-text2 { animation: slideUp 5s ease-in-out infinite 1.8s; }
      .slide-text3 { animation: slideUp 5s ease-in-out infinite 3.6s; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="250" fill="url(#bgGrad)" rx="16"/>
  
  <!-- Floating Coding Icons -->
  
  <!-- Row 1 - Top -->
  <g class="float1">
    <text x="60" y="50" font-size="32" opacity="0.4">&lt;/&gt;</text>
  </g>
  <g class="float2" style="animation-delay: 0.3s;">
    <text x="180" y="35" font-size="28" opacity="0.35">{ }</text>
  </g>
  <g class="float3" style="animation-delay: 0.6s;">
    <text x="300" y="45" font-size="30" opacity="0.4">[]</text>
  </g>
  <g class="float4" style="animation-delay: 0.9s;">
    <text x="420" y="30" font-size="34" opacity="0.35">()</text>
  </g>
  <g class="float5" style="animation-delay: 1.2s;">
    <text x="540" y="40" font-size="28" opacity="0.4">#</text>
  </g>
  <g class="float6" style="animation-delay: 0.5s;">
    <text x="660" y="35" font-size="32" opacity="0.35">$</text>
  </g>
  
  <!-- Row 2 - Middle -->
  <g class="float7" style="animation-delay: 0.7s;">
    <text x="40" y="110" font-size="28" opacity="0.3">▲</text>
  </g>
  <g class="float8" style="animation-delay: 1.1s;">
    <text x="130" y="100" font-size="30" opacity="0.35">❖</text>
  </g>
  <g class="float1" style="animation-delay: 0.4s;">
    <text x="250" y="115" font-size="32" opacity="0.4">◈</text>
  </g>
  <g class="float3" style="animation-delay: 0.8s;">
    <text x="370" y="105" font-size="28" opacity="0.35">✦</text>
  </g>
  <g class="float5" style="animation-delay: 1.3s;">
    <text x="480" y="110" font-size="34" opacity="0.4">⚡</text>
  </g>
  <g class="float2" style="animation-delay: 0.6s;">
    <text x="600" y="100" font-size="30" opacity="0.35">►</text>
  </g>
  <g class="float4" style="animation-delay: 1.0s;">
    <text x="720" y="115" font-size="28" opacity="0.4">⌘</text>
  </g>
  
  <!-- Row 3 - Bottom -->
  <g class="float6" style="animation-delay: 0.2s;">
    <text x="80" y="180" font-size="26" opacity="0.3">〰️</text>
  </g>
  <g class="float7" style="animation-delay: 0.9s;">
    <text x="200" y="175" font-size="30" opacity="0.35">✧</text>
  </g>
  <g class="float8" style="animation-delay: 0.5s;">
    <text x="330" y="185" font-size="28" opacity="0.4">◆</text>
  </g>
  <g class="float1" style="animation-delay: 1.2s;">
    <text x="450" y="170" font-size="32" opacity="0.35">◉</text>
  </g>
  <g class="float3" style="animation-delay: 0.7s;">
    <text x="570" y="180" font-size="26" opacity="0.4">▶</text>
  </g>
  <g class="float5" style="animation-delay: 1.1s;">
    <text x="680" y="175" font-size="30" opacity="0.35">⏺</text>
  </g>
  
  <!-- Tech Stack Icons - Floating -->
  <g class="float2" style="animation-delay: 0.3s;">
    <text x="80" y="220" font-size="20" fill="#00D4FF" opacity="0.5">React</text>
  </g>
  <g class="float4" style="animation-delay: 0.8s;">
    <text x="200" y="215" font-size="20" fill="#7B2FBE" opacity="0.5">Java</text>
  </g>
  <g class="float6" style="animation-delay: 1.2s;">
    <text x="320" y="225" font-size="20" fill="#FF6B8A" opacity="0.5">JS</text>
  </g>
  <g class="float8" style="animation-delay: 0.5s;">
    <text x="430" y="218" font-size="20" fill="#00F260" opacity="0.5">TS</text>
  </g>
  <g class="float1" style="animation-delay: 1.0s;">
    <text x="540" y="222" font-size="20" fill="#F7971E" opacity="0.5">Python</text>
  </g>
  <g class="float3" style="animation-delay: 0.7s;">
    <text x="660" y="215" font-size="20" fill="#00D4FF" opacity="0.5">Node</text>
  </g>
  
  <!-- Main Content -->
  <g transform="translate(60, 45)">
    <!-- Greeting -->
    <text x="0" y="0" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#00D4FF" opacity="0.8">
      👋 Hello, I'm
    </text>
    
    <!-- Name -->
    <text x="0" y="48" font-family="'Segoe UI', Arial, sans-serif" font-size="46" font-weight="800" class="shimmer-text">
      David Daniel
    </text>
    <text x="0" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="36" font-weight="700" class="shimmer-text" style="animation-delay: 1.5s;">
      Sepkitt
    </text>
  </g>
  
  <!-- Role Tags -->
  <g transform="translate(60, 155)">
    <rect x="0" y="0" width="4" height="20" rx="2" fill="#00D4FF"/>
    <text x="15" y="14" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#a0a0b0" class="slide-text">
      🚀 Aspiring Full Stack Developer
    </text>
    <text x="15" y="14" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#a0a0b0" class="slide-text2">
      💡 Building with React, Java & JavaScript
    </text>
    <text x="15" y="14" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#a0a0b0" class="slide-text3">
      🌍 Cape Town, South Africa
    </text>
  </g>
  
  <!-- Status Dot -->
  <g transform="translate(700, 220)">
    <circle cx="0" cy="0" r="4" fill="#00F260">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="10" y="4" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#00F260" opacity="0.7">Open to work</text>
  </g>
  
  <!-- Corner Decorations -->
  <rect x="15" y="15" width="20" height="2" rx="1" fill="#00D4FF" opacity="0.3"/>
  <rect x="15" y="15" width="2" height="15" rx="1" fill="#00D4FF" opacity="0.3"/>
  <rect x="765" y="15" width="20" height="2" rx="1" fill="#FF6B8A" opacity="0.3"/>
  <rect x="783" y="15" width="2" height="15" rx="1" fill="#FF6B8A" opacity="0.3"/>
  <rect x="15" y="233" width="20" height="2" rx="1" fill="#7B2FBE" opacity="0.3"/>
  <rect x="15" y="220" width="2" height="15" rx="1" fill="#7B2FBE" opacity="0.3"/>
  <rect x="765" y="233" width="20" height="2" rx="1" fill="#00F260" opacity="0.3"/>
  <rect x="783" y="220" width="2" height="15" rx="1" fill="#00F260" opacity="0.3"/>
  
  <!-- Subtle glow ring -->
  <circle cx="700" cy="40" r="50" fill="none" stroke="#00D4FF" stroke-width="0.5" opacity="0.05" class="pulse"/>
  <circle cx="700" cy="40" r="70" fill="none" stroke="#7B2FBE" stroke-width="0.5" opacity="0.03" class="pulse" style="animation-delay: 1s;"/>
</svg>
