<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250">
  <defs>
    <style>
      /* Ground scrolling - authentic speed */
      @keyframes groundScroll {
        0% { transform: translateX(0); }
        100% { transform: translateX(-24px); }
      }
      
      /* Dino running - 2-frame animation like the real game */
      @keyframes dinoRun1 {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-2px); }
      }
      
      @keyframes dinoRun2 {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(2px); }
      }
      
      /* Jump animation - parabolic arc */
      @keyframes jump {
        0% { transform: translateY(0); }
        10% { transform: translateY(-10px); }
        30% { transform: translateY(-60px); }
        50% { transform: translateY(-65px); }
        70% { transform: translateY(-60px); }
        90% { transform: translateY(-10px); }
        100% { transform: translateY(0); }
      }
      
      /* Cactus movement */
      @keyframes cactusMove {
        0% { transform: translateX(0); }
        100% { transform: translateX(-620px); }
      }
      
      /* Cloud movement - slower */
      @keyframes cloudMove {
        0% { transform: translateX(0); }
        100% { transform: translateX(-500px); }
      }
      
      /* Pterodactyl movement */
      @keyframes pteraMove {
        0% { transform: translateX(0) translateY(0); }
        25% { transform: translateX(-150px) translateY(-5px); }
        50% { transform: translateX(-300px) translateY(0); }
        75% { transform: translateX(-450px) translateY(-5px); }
        100% { transform: translateX(-600px) translateY(0); }
      }
      
      /* Wing flap for pterodactyl */
      @keyframes wingFlap {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(-0.6); }
      }
      
      .ground-line { animation: groundScroll 0.8s linear infinite; }
      .dino-jump { animation: jump 0.7s ease-in-out infinite; }
      .cactus { animation: cactusMove 3.5s linear infinite; }
      .cactus2 { animation: cactusMove 3.5s linear infinite 1.8s; }
      .cloud { animation: cloudMove 8s linear infinite; }
      .cloud2 { animation: cloudMove 8s linear infinite 4s; }
      .ptera { animation: pteraMove 4s linear infinite; }
      .wing-flap { animation: wingFlap 0.2s ease-in-out infinite; }
      
      /* Dino leg positions - 2 frame running */
      .leg-up { animation: dinoRun1 0.2s steps(2) infinite; }
      .leg-down { animation: dinoRun2 0.2s steps(2) infinite; }
      
      /* Dino arm position */
      .arm-back { animation: dinoRun1 0.2s steps(2) infinite; }
      .arm-forward { animation: dinoRun2 0.2s steps(2) infinite; }
    </style>
  </defs>
  
  <!-- Sky Background - Authentic Chrome color -->
  <rect width="600" height="250" fill="#f7f7f7"/>
  
  <!-- Clouds - Authentic style -->
  <g class="cloud">
    <ellipse cx="80" cy="45" rx="30" ry="14" fill="#e5e5e5"/>
    <ellipse cx="100" cy="40" rx="22" ry="11" fill="#e5e5e5"/>
    <ellipse cx="60" cy="42" rx="18" ry="9" fill="#e5e5e5"/>
  </g>
  <g class="cloud2">
    <ellipse cx="280" cy="55" rx="25" ry="12" fill="#e5e5e5"/>
    <ellipse cx="300" cy="50" rx="20" ry="10" fill="#e5e5e5"/>
    <ellipse cx="265" cy="52" rx="16" ry="8" fill="#e5e5e5"/>
  </g>
  
  <!-- Ground - Authentic -->
  <rect x="0" y="210" width="600" height="40" fill="#e0e0e0"/>
  <rect x="0" y="208" width="600" height="3" fill="#d5d5d5"/>
  
  <!-- Ground lines - authentic spacing -->
  <g class="ground-line">
    <rect x="0" y="220" width="20" height="2" fill="#c8c8c8"/>
    <rect x="40" y="220" width="20" height="2" fill="#c8c8c8"/>
    <rect x="80" y="220" width="20" height="2" fill="#c8c8c8"/>
    <rect x="120" y="220" width="20" height="2" fill="#c8c8c8"/>
    <rect x="160" y="220" width="20" height="2" fill="#c8c8c8"/>
    <rect x="200" y="220" width="20" height="2" fill="#c8c8c8"/>
    <rect x="240" y="220" width="20" height="2" fill="#c8c8c8"/>
    <rect x="280" y="220" width="20" height="2" fill="#c8c8c8"/>
    <rect x="320" y="220" width="20" height="2" fill="#c8c8c8"/>
    <rect x="360" y="220" width="20" height="2" fill="#c8c8c8"/>
    <rect x="400" y="220" width="20" height="2" fill="#c8c8c8"/>
    <rect x="440" y="220" width="20" height="2" fill="#c8c8c8"/>
    <rect x="480" y="220" width="20" height="2" fill="#c8c8c8"/>
    <rect x="520" y="220" width="20" height="2" fill="#c8c8c8"/>
    <rect x="560" y="220" width="20" height="2" fill="#c8c8c8"/>
    <rect x="600" y="220" width="20" height="2" fill="#c8c8c8"/>
  </g>
  
  <!-- DINO - Authentic pixel art style -->
  <g class="dino-jump">
    <!-- Body - Pixel perfect shape -->
    <rect x="50" y="165" width="34" height="30" fill="#535353"/>
    <rect x="52" y="162" width="30" height="6" fill="#535353"/>
    <rect x="54" y="158" width="24" height="6" fill="#535353"/>
    
    <!-- Head -->
    <rect x="78" y="155" width="20" height="12" fill="#535353"/>
    <rect x="82" y="152" width="14" height="6" fill="#535353"/>
    <rect x="92" y="150" width="6" height="6" fill="#535353"/> <!-- Snout tip -->
    
    <!-- Jaw -->
    <rect x="82" y="164" width="14" height="3" fill="#535353"/>
    
    <!-- Eye -->
    <rect x="84" y="156" width="4" height="4" fill="white"/>
    <rect x="85" y="157" width="2" height="2" fill="#222"/>
    
    <!-- Teeth -->
    <rect x="84" y="164" width="2" height="2" fill="white"/>
    <rect x="88" y="164" width="2" height="2" fill="white"/>
    <rect x="92" y="164" width="2" height="2" fill="white"/>
    
    <!-- Back plates -->
    <rect x="54" y="158" width="4" height="6" fill="#444"/>
    <rect x="60" y="156" width="4" height="8" fill="#444"/>
    <rect x="66" y="156" width="4" height="8" fill="#444"/>
    <rect x="72" y="158" width="4" height="6" fill="#444"/>
    
    <!-- Tail -->
    <rect x="46" y="170" width="6" height="4" fill="#535353"/>
    <rect x="42" y="168" width="6" height="4" fill="#535353"/>
    <rect x="38" y="170" width="6" height="4" fill="#535353"/>
    <rect x="34" y="172" width="6" height="2" fill="#535353"/>
    
    <!-- Legs - Frame 1 -->
    <g class="leg-up">
      <rect x="54" y="192" width="8" height="16" fill="#535353"/>
      <rect x="52" y="206" width="12" height="4" fill="#535353"/>
    </g>
    <g class="leg-down">
      <rect x="70" y="195" width="8" height="13" fill="#535353"/>
      <rect x="68" y="206" width="12" height="4" fill="#535353"/>
    </g>
    
    <!-- Arms -->
    <g class="arm-back">
      <rect x="74" y="178" width="4" height="10" fill="#535353"/>
    </g>
    <g class="arm-forward">
      <rect x="78" y="176" width="4" height="10" fill="#535353"/>
    </g>
  </g>
  
  <!-- CACTUS 1 - Classic T-Rex game cactus -->
  <g class="cactus">
    <!-- Main trunk -->
    <rect x="580" y="180" width="12" height="30" rx="2" fill="#4CAF50"/>
    <!-- Left arm -->
    <rect x="574" y="184" width="8" height="14" rx="2" fill="#4CAF50"/>
    <!-- Right arm -->
    <rect x="590" y="186" width="8" height="12" rx="2" fill="#4CAF50"/>
    <!-- Highlights -->
    <rect x="580" y="180" width="4" height="30" rx="2" fill="#66BB6A" opacity="0.4"/>
    <rect x="574" y="184" width="3" height="14" rx="2" fill="#66BB6A" opacity="0.4"/>
    <rect x="590" y="186" width="3" height="12" rx="2" fill="#66BB6A" opacity="0.4"/>
  </g>
  
  <!-- CACTUS 2 - Small cactus -->
  <g class="cactus2">
    <!-- Main trunk -->
    <rect x="580" y="188" width="10" height="22" rx="2" fill="#43A047"/>
    <!-- Left arm -->
    <rect x="575" y="190" width="7" height="10" rx="2" fill="#43A047"/>
    <!-- Highlights -->
    <rect x="580" y="188" width="3" height="22" rx="2" fill="#66BB6A" opacity="0.4"/>
  </g>
  
  <!-- PTERODACTYL - Authentic pixel style -->
  <g class="ptera">
    <!-- Body -->
    <rect x="560" y="95" width="14" height="8" fill="#666"/>
    <rect x="562" y="93" width="10" height="6" fill="#666"/>
    
    <!-- Head -->
    <rect x="572" y="90" width="6" height="6" fill="#666"/>
    <rect x="576" y="88" width="4" height="4" fill="#666"/>
    
    <!-- Eye -->
    <rect x="574" y="91" width="2" height="2" fill="white"/>
    <rect x="575" y="91" width="1" height="1" fill="#222"/>
    
    <!-- Wing - Flapping -->
    <g class="wing-flap">
      <rect x="556" y="88" width="4" height="16" fill="#555"/>
      <rect x="552" y="84" width="4" height="16" fill="#555"/>
      <rect x="548" y="82" width="4" height="16" fill="#555"/>
    </g>
    
    <!-- Wing bottom -->
    <rect x="556" y="98" width="4" height="6" fill="#555"/>
    
    <!-- Tail -->
    <rect x="554" y="97" width="6" height="4" fill="#666"/>
    <rect x="550" y="95" width="6" height="4" fill="#666"/>
  </g>
  
  <!-- SCORE - Authentic Chrome Dino Game style -->
  <g>
    <!-- Score number display -->
    <text x="520" y="28" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#535353" letter-spacing="2">0000</text>
    
    <!-- HI Score -->
    <text x="520" y="48" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#8e8e93" letter-spacing="1">HI 0000</text>
  </g>
  
  <!-- GAME OVER TEXT - Subtle instruction -->
  <text x="200" y="100" font-family="'Courier New', monospace" font-size="13" fill="#8e8e93" opacity="0.25">
    Press SPACE to jump
  </text>
  
  <!-- Speed indicator - subtle dots -->
  <circle cx="30" cy="30" r="2" fill="#d0d0d0" opacity="0.3"/>
  <circle cx="38" cy="30" r="2" fill="#d0d0d0" opacity="0.2"/>
  <circle cx="46" cy="30" r="2" fill="#d0d0d0" opacity="0.1"/>
</svg>
