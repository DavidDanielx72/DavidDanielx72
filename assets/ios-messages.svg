<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="900" height="180">
  <defs>
    <!-- Premium Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d"/>
      <stop offset="50%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0d0d0d"/>
    </linearGradient>
    
    <!-- Premium Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="25%" style="stop-color:#FFF8DC"/>
      <stop offset="50%" style="stop-color:#FFD700"/>
      <stop offset="75%" style="stop-color:#FFA500"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
    
    <!-- Premium Rose Gold -->
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8B4B8"/>
      <stop offset="50%" style="stop-color:#F5D0C5"/>
      <stop offset="100%" style="stop-color:#E8B4B8"/>
    </linearGradient>
    
    <!-- Premium Platinum -->
    <linearGradient id="platinumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E5E4E2"/>
      <stop offset="50%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E5E4E2"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="goldGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes floatGold {
        0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.9; }
        33% { transform: translateY(-18px) rotate(4deg); opacity: 1; }
        66% { transform: translateY(-8px) rotate(-2deg); opacity: 0.85; }
      }
      @keyframes floatSilver {
        0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.6; }
        50% { transform: translateY(-14px) rotate(-3deg); opacity: 0.8; }
      }
      @keyframes floatSmall {
        0%, 100% { transform: translateY(0px); opacity: 0.4; }
        50% { transform: translateY(-8px); opacity: 0.6; }
      }
      @keyframes breathe {
        0%, 100% { opacity: 0.06; transform: scale(1); }
        50% { opacity: 0.15; transform: scale(1.1); }
      }
      @keyframes shimmerLine {
        0% { opacity: 0.02; }
        50% { opacity: 0.08; }
        100% { opacity: 0.02; }
      }
      
      .gold { animation: floatGold 5s ease-in-out infinite; }
      .silver { animation: floatSilver 4.2s ease-in-out infinite; }
      .small { animation: floatSmall 3.5s ease-in-out infinite; }
      .breathe { animation: breathe 4s ease-in-out infinite; }
      .shimmer { animation: shimmerLine 3s ease-in-out infinite; }
      
      .gold:nth-child(2) { animation-delay: 0.6s; }
      .gold:nth-child(3) { animation-delay: 1.2s; }
      .silver:nth-child(2) { animation-delay: 0.8s; }
      .silver:nth-child(3) { animation-delay: 1.4s; }
      .small:nth-child(2) { animation-delay: 0.5s; }
      .small:nth-child(3) { animation-delay: 1.0s; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="180" fill="url(#bgGrad)" rx="16"/>
  
  <!-- Ambient Glow -->
  <ellipse cx="200" cy="90" rx="200" ry="100" fill="#FFD700" opacity="0.04" class="breathe"/>
  <ellipse cx="700" cy="90" rx="200" ry="100" fill="#FFD700" opacity="0.04" class="breathe" style="animation-delay: 2s;"/>
  
  <!-- Subtle Lines -->
  <g class="shimmer">
    <line x1="0" y1="45" x2="900" y2="45" stroke="#FFD700" stroke-width="0.5"/>
    <line x1="0" y1="90" x2="900" y2="90" stroke="#FFD700" stroke-width="0.5"/>
    <line x1="0" y1="135" x2="900" y2="135" stroke="#FFD700" stroke-width="0.5"/>
  </g>
  
  <!-- Main Icons - Gold -->
  <g class="gold">
    <text x="50" y="60" font-family="'SF Mono', 'Courier New', monospace" font-size="44" fill="url(#goldGrad)" font-weight="700" filter="url(#goldGlow)">&lt;/&gt;</text>
  </g>
  <g class="gold" style="animation-delay: 0.7s;">
    <text x="210" y="50" font-family="'SF Mono', 'Courier New', monospace" font-size="38" fill="url(#goldGrad)" font-weight="700" filter="url(#subtleGlow)">{ }</text>
  </g>
  <g class="gold" style="animation-delay: 1.4s;">
    <text x="380" y="60" font-family="'SF Mono', 'Courier New', monospace" font-size="40" fill="url(#goldGrad)" font-weight="700" filter="url(#subtleGlow)">[ ]</text>
  </g>
  <g class="gold" style="animation-delay: 0.9s;">
    <text x="550" y="55" font-family="'SF Mono', 'Courier New', monospace" font-size="46" fill="url(#goldGrad)" font-weight="700" filter="url(#goldGlow)">( )</text>
  </g>
  <g class="gold" style="animation-delay: 1.6s;">
    <text x="730" y="60" font-family="'SF Mono', 'Courier New', monospace" font-size="38" fill="url(#goldGrad)" font-weight="700" filter="url(#subtleGlow)">#</text>
  </g>
  
  <!-- Secondary Icons - Rose Gold -->
  <g class="silver">
    <text x="120" y="105" font-family="'SF Mono', 'Courier New', monospace" font-size="26" fill="url(#roseGrad)" font-weight="400" filter="url(#subtleGlow)">✦</text>
  </g>
  <g class="silver" style="animation-delay: 1.0s;">
    <text x="290" y="98" font-family="'SF Mono', 'Courier New', monospace" font-size="24" fill="url(#roseGrad)" font-weight="400">◈</text>
  </g>
  <g class="silver" style="animation-delay: 0.6s;">
    <text x="460" y="108" font-family="'SF Mono', 'Courier New', monospace" font-size="28" fill="url(#roseGrad)" font-weight="400" filter="url(#subtleGlow)">★</text>
  </g>
  <g class="silver" style="animation-delay: 1.3s;">
    <text x="640" y="100" font-family="'SF Mono', 'Courier New', monospace" font-size="26" fill="url(#roseGrad)" font-weight="400">⌘</text>
  </g>
  <g class="silver" style="animation-delay: 0.8s;">
    <text x="810" y="105" font-family="'SF Mono', 'Courier New', monospace" font-size="24" fill="url(#roseGrad)" font-weight="400">◆</text>
  </g>
  
  <!-- Small Details - Platinum -->
  <g class="small">
    <text x="40" y="155" font-family="'SF Mono', 'Courier New', monospace" font-size="16" fill="url(#platinumGrad)" opacity="0.5">+</text>
  </g>
  <g class="small" style="animation-delay: 0.8s;">
    <text x="150" y="148" font-family="'SF Mono', 'Courier New', monospace" font-size="18" fill="url(#platinumGrad)" opacity="0.4">-</text>
  </g>
  <g class="small" style="animation-delay: 1.2s;">
    <text x="270" y="155" font-family="'SF Mono', 'Courier New', monospace" font-size="14" fill="url(#platinumGrad)" opacity="0.5">=</text>
  </g>
  <g class="small" style="animation-delay: 0.6s;">
    <text x="390" y="148" font-family="'SF Mono', 'Courier New', monospace" font-size="18" fill="url(#platinumGrad)" opacity="0.4">&gt;</text>
  </g>
  <g class="small" style="animation-delay: 1.4s;">
    <text x="510" y="155" font-family="'SF Mono', 'Courier New', monospace" font-size="16" fill="url(#platinumGrad)" opacity="0.5">&lt;</text>
  </g>
  <g class="small" style="animation-delay: 0.7s;">
    <text x="630" y="148" font-family="'SF Mono', 'Courier New', monospace" font-size="18" fill="url(#platinumGrad)" opacity="0.4">/</text>
  </g>
  <g class="small" style="animation-delay: 1.1s;">
    <text x="760" y="155" font-family="'SF Mono', 'Courier New', monospace" font-size="16" fill="url(#platinumGrad)" opacity="0.5">\</text>
  </g>
  <g class="small" style="animation-delay: 0.9s;">
    <text x="870" y="148" font-family="'SF Mono', 'Courier New', monospace" font-size="18" fill="url(#platinumGrad)" opacity="0.4">|</text>
  </g>
  
  <!-- Corner Accents -->
  <g opacity="0.15">
    <rect x="12" y="12" width="28" height="2" rx="1" fill="#FFD700"/>
    <rect x="12" y="12" width="2" height="20" rx="1" fill="#FFD700"/>
    <rect x="860" y="12" width="28" height="2" rx="1" fill="#FFD700"/>
    <rect x="886" y="12" width="2" height="20" rx="1" fill="#FFD700"/>
    <rect x="12" y="166" width="28" height="2" rx="1" fill="#FFD700"/>
    <rect x="12" y="148" width="2" height="20" rx="1" fill="#FFD700"/>
    <rect x="860" y="166" width="28" height="2" rx="1" fill="#FFD700"/>
    <rect x="886" y="148" width="2" height="20" rx="1" fill="#FFD700"/>
  </g>
  
  <!-- Elegant Center Dot -->
  <circle cx="450" cy="90" r="3" fill="#FFD700" opacity="0.2"/>
  <circle cx="450" cy="90" r="6" fill="none" stroke="#FFD700" stroke-width="0.5" opacity="0.1"/>
  <circle cx="450" cy="90" r="9" fill="none" stroke="#FFD700" stroke-width="0.3" opacity="0.06"/>
</svg>
