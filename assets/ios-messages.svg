<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <!-- Premium Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="40%" style="stop-color:#141414"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
    
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FFA500"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
    
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFC107"/>
      <stop offset="50%" style="stop-color:#FF9800"/>
      <stop offset="100%" style="stop-color:#FFC107"/>
    </linearGradient>
    
    <linearGradient id="gold3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD54F"/>
      <stop offset="50%" style="stop-color:#FFB300"/>
      <stop offset="100%" style="stop-color:#FFD54F"/>
    </linearGradient>
    
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E0E0E0"/>
      <stop offset="50%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E0E0E0"/>
    </linearGradient>
    
    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0"/>
    </radialGradient>
    
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#9B59B6;stop-opacity:0"/>
    </radialGradient>

    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes floatGold {
        0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); opacity: 0.7; }
        25% { transform: translateY(-15px) rotate(3deg) scale(1.05); opacity: 0.9; }
        75% { transform: translateY(-8px) rotate(-3deg) scale(0.95); opacity: 0.8; }
      }
      @keyframes floatSilver {
        0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); opacity: 0.5; }
        30% { transform: translateY(-12px) rotate(-4deg) scale(1.03); opacity: 0.7; }
        70% { transform: translateY(-6px) rotate(4deg) scale(0.97); opacity: 0.6; }
      }
      @keyframes floatSmall {
        0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.4; }
        50% { transform: translateY(-10px) rotate(5deg); opacity: 0.6; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.08; transform: scale(1); }
        50% { opacity: 0.2; transform: scale(1.2); }
      }
      @keyframes shimmer {
        0% { opacity: 0.1; }
        50% { opacity: 0.3; }
        100% { opacity: 0.1; }
      }
      @keyframes spinSlow {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .fg { animation: floatGold 4.5s ease-in-out infinite; }
      .fs { animation: floatSilver 4s ease-in-out infinite; }
      .fsm { animation: floatSmall 3.5s ease-in-out infinite; }
      .pulse { animation: pulseGlow 4s ease-in-out infinite; }
      .shimmer { animation: shimmer 3s ease-in-out infinite; }
      .spin { animation: spinSlow 20s linear infinite; }
      
      .fg:nth-child(2) { animation-delay: 0.5s; }
      .fg:nth-child(3) { animation-delay: 1s; }
      .fs:nth-child(2) { animation-delay: 0.7s; }
      .fs:nth-child(3) { animation-delay: 1.2s; }
      .fsm:nth-child(2) { animation-delay: 0.4s; }
      .fsm:nth-child(3) { animation-delay: 0.9s; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="200" fill="url(#bgGrad)" rx="16"/>
  
  <!-- Glow Orbs -->
  <circle cx="100" cy="60" r="100" fill="url(#glowGold)" class="pulse"/>
  <circle cx="450" cy="100" r="100" fill="url(#glowPurple)" class="pulse" style="animation-delay: 2s;"/>
  <circle cx="800" cy="50" r="100" fill="url(#glowGold)" class="pulse" style="animation-delay: 3.5s;"/>
  
  <!-- Decorative Lines -->
  <g opacity="0.03" class="shimmer">
    <line x1="0" y1="40" x2="900" y2="40" stroke="#FFD700" stroke-width="1"/>
    <line x1="0" y1="80" x2="900" y2="80" stroke="#FFD700" stroke-width="1"/>
    <line x1="0" y1="120" x2="900" y2="120" stroke="#FFD700" stroke-width="1"/>
    <line x1="0" y1="160" x2="900" y2="160" stroke="#FFD700" stroke-width="1"/>
  </g>
  
  <!-- Decorative Circles -->
  <circle cx="850" cy="30" r="2" fill="#FFD700" opacity="0.3" class="shimmer" style="animation-delay: 0.5s;"/>
  <circle cx="50" cy="170" r="2" fill="#FFD700" opacity="0.3" class="shimmer" style="animation-delay: 1s;"/>
  <circle cx="200" cy="20" r="1.5" fill="#FFD700" opacity="0.2" class="shimmer" style="animation-delay: 1.5s;"/>
  <circle cx="700" cy="180" r="1.5" fill="#FFD700" opacity="0.2" class="shimmer" style="animation-delay: 2s;"/>
  
  <!-- Spinning Ring -->
  <circle cx="450" cy="100" r="70" fill="none" stroke="#FFD700" stroke-width="0.5" opacity="0.08" class="spin"/>
  <circle cx="450" cy="100" r="85" fill="none" stroke="#FFD700" stroke-width="0.3" opacity="0.05" class="spin" style="animation-duration: 25s;"/>
  
  <!-- Premium Gold Icons - Row 1 -->
  <g class="fg">
    <text x="40" y="55" font-family="'Courier New', monospace" font-size="42" fill="url(#gold1)" opacity="0.8" font-weight="bold" filter="url(#glowFilter)">&lt;/&gt;</text>
  </g>
  <g class="fg" style="animation-delay: 0.6s;">
    <text x="190" y="45" font-family="'Courier New', monospace" font-size="36" fill="url(#gold2)" opacity="0.75" font-weight="bold" filter="url(#softGlow)">{ }</text>
  </g>
  <g class="fg" style="animation-delay: 1.2s;">
    <text x="340" y="55" font-family="'Courier New', monospace" font-size="38" fill="url(#gold3)" opacity="0.8" font-weight="bold" filter="url(#softGlow)">[ ]</text>
  </g>
  <g class="fg" style="animation-delay: 0.8s;">
    <text x="490" y="50" font-family="'Courier New', monospace" font-size="44" fill="url(#gold1)" opacity="0.75" font-weight="bold" filter="url(#glowFilter)">( )</text>
  </g>
  <g class="fg" style="animation-delay: 1.5s;">
    <text x="650" y="55" font-family="'Courier New', monospace" font-size="36" fill="url(#gold2)" opacity="0.8" font-weight="bold" filter="url(#softGlow)">#</text>
  </g>
  <g class="fg" style="animation-delay: 0.4s;">
    <text x="800" y="45" font-family="'Courier New', monospace" font-size="38" fill="url(#gold3)" opacity="0.75" font-weight="bold" filter="url(#softGlow)">$</text>
  </g>
  
  <!-- Silver/Icons - Row 2 -->
  <g class="fs">
    <text x="100" y="105" font-family="'Courier New', monospace" font-size="28" fill="url(#silverGrad)" opacity="0.5" filter="url(#softGlow)">★</text>
  </g>
  <g class="fs" style="animation-delay: 0.9s;">
    <text x="250" y="98" font-family="'Courier New', monospace" font-size="26" fill="url(#silverGrad)" opacity="0.45">◈</text>
  </g>
  <g class="fs" style="animation-delay: 1.3s;">
    <text x="400" y="110" font-family="'Courier New', monospace" font-size="30" fill="url(#silverGrad)" opacity="0.5">✦</text>
  </g>
  <g class="fs" style="animation-delay: 0.5s;">
    <text x="550" y="100" font-family="'Courier New', monospace" font-size="28" fill="url(#silverGrad)" opacity="0.45">⌘</text>
  </g>
  <g class="fs" style="animation-delay: 1.1s;">
    <text x="700" y="105" font-family="'Courier New', monospace" font-size="26" fill="url(#silverGrad)" opacity="0.5">◆</text>
  </g>
  <g class="fs" style="animation-delay: 0.7s;">
    <text x="840" y="98" font-family="'Courier New', monospace" font-size="28" fill="url(#silverGrad)" opacity="0.45">►</text>
  </g>
  
  <!-- Small Gold Details - Row 3 -->
  <g class="fsm">
    <text x="30" y="165" font-family="'Courier New', monospace" font-size="18" fill="#FFD700" opacity="0.3">+</text>
  </g>
  <g class="fsm" style="animation-delay: 0.6s;">
    <text x="130" y="158" font-family="'Courier New', monospace" font-size="20" fill="#FFD700" opacity="0.25">-</text>
  </g>
  <g class="fsm" style="animation-delay: 1.2s;">
    <text x="240" y="170" font-family="'Courier New', monospace" font-size="16" fill="#FFD700" opacity="0.3">=</text>
  </g>
  <g class="fsm" style="animation-delay: 0.8s;">
    <text x="350" y="160" font-family="'Courier New', monospace" font-size="20" fill="#FFD700" opacity="0.25">&gt;</text>
  </g>
  <g class="fsm" style="animation-delay: 1.4s;">
    <text x="460" y="165" font-family="'Courier New', monospace" font-size="18" fill="#FFD700" opacity="0.3">&lt;</text>
  </g>
  <g class="fsm" style="animation-delay: 0.5s;">
    <text x="570" y="158" font-family="'Courier New', monospace" font-size="20" fill="#FFD700" opacity="0.25">/</text>
  </g>
  <g class="fsm" style="animation-delay: 1.0s;">
    <text x="680" y="170" font-family="'Courier New', monospace" font-size="16" fill="#FFD700" opacity="0.3">\</text>
  </g>
  <g class="fsm" style="animation-delay: 0.7s;">
    <text x="790" y="160" font-family="'Courier New', monospace" font-size="20" fill="#FFD700" opacity="0.25">|</text>
  </g>
  <g class="fsm" style="animation-delay: 1.3s;">
    <text x="880" y="165" font-family="'Courier New', monospace" font-size="18" fill="#FFD700" opacity="0.3">~</text>
  </g>
  
  <!-- Corner Decorations -->
  <rect x="15" y="15" width="30" height="2" rx="1" fill="#FFD700" opacity="0.15"/>
  <rect x="15" y="15" width="2" height="22" rx="1" fill="#FFD700" opacity="0.15"/>
  <rect x="855" y="15" width="30" height="2" rx="1" fill="#FFD700" opacity="0.15"/>
  <rect x="883" y="15" width="2" height="22" rx="1" fill="#FFD700" opacity="0.15"/>
  <rect x="15" y="183" width="30" height="2" rx="1" fill="#FFD700" opacity="0.15"/>
  <rect x="15" y="163" width="2" height="22" rx="1" fill="#FFD700" opacity="0.15"/>
  <rect x="855" y="183" width="30" height="2" rx="1" fill="#FFD700" opacity="0.15"/>
  <rect x="883" y="163" width="2" height="22" rx="1" fill="#FFD700" opacity="0.15"/>
  
  <!-- Central Premium Accent -->
  <g transform="translate(450, 100)" opacity="0.15">
    <circle cx="0" cy="0" r="35" fill="none" stroke="#FFD700" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="25" fill="none" stroke="#FFD700" stroke-width="0.3"/>
    <text x="0" y="6" text-anchor="middle" font-size="14" fill="#FFD700" font-family="monospace">⚡</text>
  </g>
</svg>
