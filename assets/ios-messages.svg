<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#0f0c29"/>
    </linearGradient>
    
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="33%" style="stop-color:#7B2FBE"/>
      <stop offset="66%" style="stop-color:#FF6B8A"/>
      <stop offset="100%" style="stop-color:#00D4FF"/>
    </linearGradient>

    <style>
      @keyframes float1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-20px); }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-15px); }
      }
      @keyframes float3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-25px); }
      }
      @keyframes float4 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-18px); }
      }
      @keyframes float5 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.8; }
      }
      @keyframes shimmer {
        0% { opacity: 0.3; }
        50% { opacity: 1; }
        100% { opacity: 0.3; }
      }
      @keyframes slide {
        0% { opacity: 0; transform: translateY(10px); }
        20% { opacity: 1; transform: translateY(0); }
        80% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-10px); }
      }
      
      .f1 { animation: float1 4s ease-in-out infinite; }
      .f2 { animation: float2 3.5s ease-in-out infinite; }
      .f3 { animation: float3 4.5s ease-in-out infinite; }
      .f4 { animation: float4 3.8s ease-in-out infinite; }
      .f5 { animation: float5 3.2s ease-in-out infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .shimmer { animation: shimmer 3s ease-in-out infinite; }
      .slide1 { animation: slide 5s ease-in-out infinite; }
      .slide2 { animation: slide 5s ease-in-out infinite 2s; }
      .slide3 { animation: slide 5s ease-in-out infinite 4s; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="250" fill="url(#bgGrad)" rx="16"/>
  
  <!-- Floating Code Icons - Top Row -->
  <g class="f1" opacity="0.3">
    <text x="50" y="50" font-family="monospace" font-size="28" fill="#00D4FF">&lt;/&gt;</text>
  </g>
  <g class="f2" opacity="0.25" style="animation-delay: 0.5s;">
    <text x="160" y="35" font-family="monospace" font-size="24" fill="#7B2FBE">{ }</text>
  </g>
  <g class="f3" opacity="0.3" style="animation-delay: 1s;">
    <text x="280" y="45" font-family="monospace" font-size="26" fill="#FF6B8A">[ ]</text>
  </g>
  <g class="f4" opacity="0.25" style="animation-delay: 0.3s;">
    <text x="390" y="30" font-family="monospace" font-size="30" fill="#00F260">( )</text>
  </g>
  <g class="f5" opacity="0.3" style="animation-delay: 0.8s;">
    <text x="510" y="40" font-family="monospace" font-size="24" fill="#F7971E">#</text>
  </g>
  <g class="f2" opacity="0.25" style="animation-delay: 1.2s;">
    <text x="620" y="35" font-family="monospace" font-size="28" fill="#00D4FF">$</text>
  </g>
  <g class="f1" opacity="0.3" style="animation-delay: 0.6s;">
    <text x="720" y="45" font-family="monospace" font-size="26" fill="#7B2FBE">&amp;</text>
  </g>
  
  <!-- Floating Icons - Middle Row -->
  <g class="f3" opacity="0.2" style="animation-delay: 0.4s;">
    <text x="80" y="100" font-family="monospace" font-size="24" fill="#FF6B8A">▲</text>
  </g>
  <g class="f5" opacity="0.25" style="animation-delay: 0.9s;">
    <text x="190" y="95" font-family="monospace" font-size="26" fill="#00F260">◆</text>
  </g>
  <g class="f1" opacity="0.2" style="animation-delay: 0.2s;">
    <text x="300" y="105" font-family="monospace" font-size="28" fill="#F7971E">★</text>
  </g>
  <g class="f4" opacity="0.25" style="animation-delay: 0.7s;">
    <text x="420" y="95" font-family="monospace" font-size="24" fill="#00D4FF">◈</text>
  </g>
  <g class="f2" opacity="0.2" style="animation-delay: 1.1s;">
    <text x="530" y="100" font-family="monospace" font-size="30" fill="#7B2FBE">✦</text>
  </g>
  <g class="f3" opacity="0.25" style="animation-delay: 0.5s;">
    <text x="650" y="95" font-family="monospace" font-size="26" fill="#FF6B8A">►</text>
  </g>
  <g class="f5" opacity="0.2" style="animation-delay: 1.3s;">
    <text x="750" y="105" font-family="monospace" font-size="24" fill="#00F260">⌘</text>
  </g>
  
  <!-- Floating Tech Names - Bottom Row -->
  <g class="f2" opacity="0.4" style="animation-delay: 0.3s;">
    <text x="60" y="200" font-family="Arial, sans-serif" font-size="16" fill="#00D4FF" font-weight="bold">React</text>
  </g>
  <g class="f4" opacity="0.4" style="animation-delay: 0.8s;">
    <text x="170" y="195" font-family="Arial, sans-serif" font-size="16" fill="#7B2FBE" font-weight="bold">Java</text>
  </g>
  <g class="f1" opacity="0.4" style="animation-delay: 0.5s;">
    <text x="280" y="205" font-family="Arial, sans-serif" font-size="16" fill="#FF6B8A" font-weight="bold">JS</text>
  </g>
  <g class="f3" opacity="0.4" style="animation-delay: 1.0s;">
    <text x="390" y="198" font-family="Arial, sans-serif" font-size="16" fill="#00F260" font-weight="bold">TS</text>
  </g>
  <g class="f5" opacity="0.4" style="animation-delay: 0.6s;">
    <text x="500" y="202" font-family="Arial, sans-serif" font-size="16" fill="#F7971E" font-weight="bold">Python</text>
  </g>
  <g class="f2" opacity="0.4" style="animation-delay: 1.2s;">
    <text x="630" y="196" font-family="Arial, sans-serif" font-size="16" fill="#00D4FF" font-weight="bold">Node</text>
  </g>
  
  <!-- Main Content -->
  <g transform="translate(60, 40)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" fill="#00D4FF" opacity="0.8">Hello, I'm</text>
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="46" font-weight="800" fill="#00D4FF">David Daniel</text>
    <text x="0" y="90" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FF6B8A">Sepkitt</text>
  </g>
  
  <!-- Role Tags -->
  <g transform="translate(60, 150)">
    <rect x="0" y="0" width="4" height="18" rx="2" fill="#00D4FF"/>
    <text x="15" y="14" font-family="Arial, sans-serif" font-size="15" fill="#a0a0b0" class="slide1">Aspiring Full Stack Developer</text>
    <text x="15" y="14" font-family="Arial, sans-serif" font-size="15" fill="#a0a0b0" class="slide2">Building with React, Java &amp; JS</text>
    <text x="15" y="14" font-family="Arial, sans-serif" font-size="15" fill="#a0a0b0" class="slide3">Cape Town, South Africa</text>
  </g>
  
  <!-- Status -->
  <g transform="translate(680, 215)">
    <circle cx="0" cy="0" r="4" fill="#00F260">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="10" y="4" font-family="Arial, sans-serif" font-size="11" fill="#00F260" opacity="0.7">Open to work</text>
  </g>
  
  <!-- Corners -->
  <rect x="15" y="15" width="20" height="2" rx="1" fill="#00D4FF" opacity="0.3"/>
  <rect x="15" y="15" width="2" height="15" rx="1" fill="#00D4FF" opacity="0.3"/>
  <rect x="765" y="15" width="20" height="2" rx="1" fill="#FF6B8A" opacity="0.3"/>
  <rect x="783" y="15" width="2" height="15" rx="1" fill="#FF6B8A" opacity="0.3"/>
  <rect x="15" y="233" width="20" height="2" rx="1" fill="#7B2FBE" opacity="0.3"/>
  <rect x="15" y="220" width="2" height="15" rx="1" fill="#7B2FBE" opacity="0.3"/>
  <rect x="765" y="233" width="20" height="2" rx="1" fill="#00F260" opacity="0.3"/>
  <rect x="783" y="220" width="2" height="15" rx="1" fill="#00F260" opacity="0.3"/>
  
  <!-- Glow Rings -->
  <circle cx="700" cy="40" r="45" fill="none" stroke="#00D4FF" stroke-width="0.5" opacity="0.1" class="pulse"/>
</svg>
