<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="800" height="180">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="50%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    
    <radialGradient id="glow1" cx="20%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0"/>
    </radialGradient>
    
    <radialGradient id="glow2" cx="50%" cy="60%" r="50%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#FF6B6B;stop-opacity:0"/>
    </radialGradient>
    
    <radialGradient id="glow3" cx="80%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#4ECDC4;stop-opacity:0"/>
    </radialGradient>

    <style>
      @keyframes float1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-18px) rotate(4deg); }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(-4deg); }
      }
      @keyframes float3 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-22px) rotate(6deg); }
      }
      @keyframes float4 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-15px) rotate(-6deg); }
      }
      @keyframes float5 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(3deg); }
      }
      @keyframes float6 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-14px) rotate(-3deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(1.05); }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.1; }
        50% { opacity: 0.4; }
      }
      
      .f1 { animation: float1 4.5s ease-in-out infinite; }
      .f2 { animation: float2 3.8s ease-in-out infinite; }
      .f3 { animation: float3 5.2s ease-in-out infinite; }
      .f4 { animation: float4 4.2s ease-in-out infinite; }
      .f5 { animation: float5 3.6s ease-in-out infinite; }
      .f6 { animation: float6 4.8s ease-in-out infinite; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      .twinkle { animation: twinkle 2.5s ease-in-out infinite; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="180" fill="url(#bgGrad)" rx="16"/>
  
  <!-- Glow Orbs -->
  <circle cx="100" cy="60" r="80" fill="url(#glow1)" class="pulse"/>
  <circle cx="400" cy="100" r="80" fill="url(#glow2)" class="pulse" style="animation-delay: 1.5s;"/>
  <circle cx="700" cy="50" r="80" fill="url(#glow3)" class="pulse" style="animation-delay: 2.5s;"/>
  
  <!-- Row 1 - Premium Icons -->
  <g class="f1">
    <text x="30" y="50" font-family="monospace" font-size="38" fill="#FFD700" opacity="0.5" font-weight="bold">&lt;/&gt;</text>
  </g>
  <g class="f2" style="animation-delay: 0.6s;">
    <text x="160" y="40" font-family="monospace" font-size="34" fill="#FF6B6B" opacity="0.45" font-weight="bold">{ }</text>
  </g>
  <g class="f3" style="animation-delay: 1.2s;">
    <text x="290" y="55" font-family="monospace" font-size="36" fill="#4ECDC4" opacity="0.5" font-weight="bold">[ ]</text>
  </g>
  <g class="f4" style="animation-delay: 0.8s;">
    <text x="420" y="45" font-family="monospace" font-size="40" fill="#FFD700" opacity="0.45" font-weight="bold">( )</text>
  </g>
  <g class="f5" style="animation-delay: 1.5s;">
    <text x="560" y="50" font-family="monospace" font-size="34" fill="#FF6B6B" opacity="0.5" font-weight="bold">#</text>
  </g>
  <g class="f6" style="animation-delay: 0.4s;">
    <text x="690" y="40" font-family="monospace" font-size="36" fill="#4ECDC4" opacity="0.45" font-weight="bold">$</text>
  </g>
  
  <!-- Row 2 - Premium Symbols -->
  <g class="f3" style="animation-delay: 0.3s;">
    <text x="70" y="100" font-family="monospace" font-size="28" fill="#4ECDC4" opacity="0.35">★</text>
  </g>
  <g class="f5" style="animation-delay: 0.9s;">
    <text x="200" y="90" font-family="monospace" font-size="26" fill="#FFD700" opacity="0.3">◈</text>
  </g>
  <g class="f1" style="animation-delay: 1.3s;">
    <text x="330" y="105" font-family="monospace" font-size="30" fill="#FF6B6B" opacity="0.35">✦</text>
  </g>
  <g class="f4" style="animation-delay: 0.5s;">
    <text x="470" y="95" font-family="monospace" font-size="28" fill="#4ECDC4" opacity="0.3">⌘</text>
  </g>
  <g class="f2" style="animation-delay: 1.1s;">
    <text x="600" y="100" font-family="monospace" font-size="26" fill="#FFD700" opacity="0.35">◆</text>
  </g>
  <g class="f6" style="animation-delay: 0.7s;">
    <text x="730" y="90" font-family="monospace" font-size="28" fill="#FF6B6B" opacity="0.3">►</text>
  </g>
  
  <!-- Row 3 - Premium Small Icons -->
  <g class="f4" style="animation-delay: 0.2s;">
    <text x="40" y="155" font-family="monospace" font-size="20" fill="#FFD700" opacity="0.25">+</text>
  </g>
  <g class="f2" style="animation-delay: 1.4s;">
    <text x="140" y="145" font-family="monospace" font-size="22" fill="#FF6B6B" opacity="0.2">-</text>
  </g>
  <g class="f5" style="animation-delay: 0.8s;">
    <text x="250" y="160" font-family="monospace" font-size="18" fill="#4ECDC4" opacity="0.25">=</text>
  </g>
  <g class="f1" style="animation-delay: 1.0s;">
    <text x="350" y="150" font-family="monospace" font-size="22" fill="#FFD700" opacity="0.2">&gt;</text>
  </g>
  <g class="f3" style="animation-delay: 0.6s;">
    <text x="460" y="155" font-family="monospace" font-size="20" fill="#FF6B6B" opacity="0.25">&lt;</text>
  </g>
  <g class="f6" style="animation-delay: 1.2s;">
    <text x="570" y="145" font-family="monospace" font-size="22" fill="#4ECDC4" opacity="0.2">/</text>
  </g>
  <g class="f2" style="animation-delay: 0.4s;">
    <text x="680" y="160" font-family="monospace" font-size="18" fill="#FFD700" opacity="0.25">\</text>
  </g>
  <g class="f4" style="animation-delay: 1.6s;">
    <text x="770" y="150" font-family="monospace" font-size="20" fill="#FF6B6B" opacity="0.2">|</text>
  </g>
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.02">
    <line x1="0" y1="45" x2="800" y2="45" stroke="#FFD700" stroke-width="0.5"/>
    <line x1="0" y1="90" x2="800" y2="90" stroke="#FFD700" stroke-width="0.5"/>
    <line x1="0" y1="135" x2="800" y2="135" stroke="#FFD700" stroke-width="0.5"/>
  </g>
  
  <!-- Premium Corner Decorations -->
  <rect x="12" y="12" width="25" height="2" rx="1" fill="#FFD700" opacity="0.15"/>
  <rect x="12" y="12" width="2" height="18" rx="1" fill="#FFD700" opacity="0.15"/>
  <rect x="763" y="12" width="25" height="2" rx="1" fill="#4ECDC4" opacity="0.15"/>
  <rect x="786" y="12" width="2" height="18" rx="1" fill="#4ECDC4" opacity="0.15"/>
  <rect x="12" y="166" width="25" height="2" rx="1" fill="#FF6B6B" opacity="0.15"/>
  <rect x="12" y="150" width="2" height="18" rx="1" fill="#FF6B6B" opacity="0.15"/>
  <rect x="763" y="166" width="25" height="2" rx="1" fill="#FFD700" opacity="0.15"/>
  <rect x="786" y="150" width="2" height="18" rx="1" fill="#FFD700" opacity="0.15"/>
  
  <!-- Premium Twinkling Dots -->
  <circle cx="50" cy="12" r="2" fill="#FFD700" class="twinkle"/>
  <circle cx="400" cy="12" r="2" fill="#4ECDC4" class="twinkle" style="animation-delay: 1s;"/>
  <circle cx="750" cy="12" r="2" fill="#FF6B6B" class="twinkle" style="animation-delay: 2s;"/>
  <circle cx="50" cy="168" r="2" fill="#FFD700" class="twinkle" style="animation-delay: 1.5s;"/>
  <circle cx="400" cy="168" r="2" fill="#4ECDC4" class="twinkle" style="animation-delay: 0.5s;"/>
  <circle cx="750" cy="168" r="2" fill="#FF6B6B" class="twinkle" style="animation-delay: 2.5s;"/>
</svg>
