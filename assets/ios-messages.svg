<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
  <defs>
    <!-- Gradient Backgrounds -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="50%" style="stop-color:#7B2FBE"/>
      <stop offset="100%" style="stop-color:#FF6B8A"/>
    </linearGradient>
    
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#FF6B8A"/>
    </linearGradient>
    
    <!-- Glow Filters -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-15px) rotate(3deg); }
      }
      
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(-3deg); }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.05); }
      }
      
      @keyframes codeRain {
        0% { opacity: 0; transform: translateY(-20px); }
        20% { opacity: 1; transform: translateY(0); }
        80% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(20px); }
      }
      
      @keyframes shimmer {
        0% { background-position: -200% center; }
        100% { background-position: 200% center; }
      }
      
      @keyframes rotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      @keyframes orbit1 {
        0% { transform: rotate(0deg) translateX(60px) rotate(0deg); }
        100% { transform: rotate(360deg) translateX(60px) rotate(-360deg); }
      }
      
      @keyframes orbit2 {
        0% { transform: rotate(120deg) translateX(60px) rotate(-120deg); }
        100% { transform: rotate(480deg) translateX(60px) rotate(-480deg); }
      }
      
      @keyframes orbit3 {
        0% { transform: rotate(240deg) translateX(60px) rotate(-240deg); }
        100% { transform: rotate(600deg) translateX(60px) rotate(-600deg); }
      }
      
      @keyframes typeWriter {
        0% { opacity: 0; transform: translateX(-20px); }
        20% { opacity: 1; transform: translateX(0); }
        80% { opacity: 1; transform: translateX(0); }
        100% { opacity: 0; transform: translateX(20px); }
      }
      
      @keyframes particleFloat {
        0% { opacity: 0; transform: translateY(0) scale(0); }
        50% { opacity: 1; transform: translateY(-30px) scale(1); }
        100% { opacity: 0; transform: translateY(-60px) scale(0); }
      }
      
      @keyframes lineDraw {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      
      .floating { animation: float 4s ease-in-out infinite; }
      .floating-reverse { animation: floatReverse 4s ease-in-out infinite 2s; }
      .pulsing { animation: pulse 3s ease-in-out infinite; }
      .rotating { animation: rotate 8s linear infinite; }
      .orbit1 { animation: orbit1 8s linear infinite; }
      .orbit2 { animation: orbit2 8s linear infinite; }
      .orbit3 { animation: orbit3 8s linear infinite; }
      .shimmer-text {
        background: linear-gradient(90deg, #00D4FF, #7B2FBE, #FF6B8A, #00D4FF);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shimmer 3s linear infinite;
      }
      
      .particle { animation: particleFloat 2s ease-in-out infinite; }
      .particle:nth-child(2) { animation-delay: 0.5s; }
      .particle:nth-child(3) { animation-delay: 1s; }
      .particle:nth-child(4) { animation-delay: 1.5s; }
      .particle:nth-child(5) { animation-delay: 0.8s; }
      .particle:nth-child(6) { animation-delay: 1.2s; }
      
      .code-line { animation: codeRain 3s ease-in-out infinite; }
      .code-line:nth-child(2) { animation-delay: 1s; }
      .code-line:nth-child(3) { animation-delay: 2s; }
      
      .type-text { animation: typeWriter 4s ease-in-out infinite; }
      .type-text:nth-child(2) { animation-delay: 1.5s; }
      .type-text:nth-child(3) { animation-delay: 3s; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="250" fill="url(#bgGrad)" rx="16"/>
  
  <!-- Background Particles -->
  <circle cx="100" cy="50" r="2" fill="#00D4FF" opacity="0.3" class="particle"/>
  <circle cx="200" cy="80" r="1.5" fill="#7B2FBE" opacity="0.3" class="particle"/>
  <circle cx="300" cy="40" r="2" fill="#FF6B8A" opacity="0.3" class="particle"/>
  <circle cx="500" cy="60" r="1.5" fill="#00D4FF" opacity="0.3" class="particle"/>
  <circle cx="600" cy="90" r="2" fill="#7B2FBE" opacity="0.3" class="particle"/>
  <circle cx="700" cy="50" r="1.5" fill="#FF6B8A" opacity="0.3" class="particle"/>
  
  <!-- Decorative Circles -->
  <circle cx="680" cy="80" r="80" fill="#00D4FF" opacity="0.03" class="pulsing"/>
  <circle cx="680" cy="80" r="120" fill="#7B2FBE" opacity="0.02" class="pulsing" style="animation-delay: 1s;"/>
  
  <!-- Orbiting Code Symbols -->
  <g class="orbit1">
    <text x="680" y="80" font-size="18" fill="#00D4FF" opacity="0.6">{"</text>
  </g>
  <g class="orbit2">
    <text x="680" y="80" font-size="18" fill="#FF6B8A" opacity="0.6">}</text>
  </g>
  <g class="orbit3">
    <text x="680" y="80" font-size="18" fill="#7B2FBE" opacity="0.6">;</text>
  </g>
  
  <!-- Central Icon - Developer -->
  <g transform="translate(680, 80)">
    <circle cx="0" cy="0" r="35" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.3"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="url(#accentGrad)" stroke-width="1" opacity="0.15"/>
    <text x="0" y="10" text-anchor="middle" font-size="28" fill="white">💻</text>
  </g>
  
  <!-- Code Rain Lines -->
  <g opacity="0.1">
    <text x="30" y="30" font-family="monospace" font-size="10" fill="#00D4FF" class="code-line">const future = 'build';</text>
    <text x="30" y="50" font-family="monospace" font-size="10" fill="#00D4FF" class="code-line">let innovation = true;</text>
    <text x="30" y="70" font-family="monospace" font-size="10" fill="#00D4FF" class="code-line">while (learning) { code(); }</text>
  </g>
  
  <!-- Main Title -->
  <g transform="translate(40, 60)">
    <text x="0" y="30" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="800" fill="white">
      David
    </text>
    <text x="0" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="800" class="shimmer-text">
      Daniel Sepkitt
    </text>
  </g>
  
  <!-- Subtitle with typing effect -->
  <g transform="translate(40, 150)">
    <!-- Glowing line -->
    <line x1="0" y1="0" x2="60" y2="0" stroke="#00D4FF" stroke-width="2" opacity="0.5"/>
    
    <text x="75" y="5" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#a0a0b0" class="type-text">
      🚀 Aspiring Full Stack Developer
    </text>
    <text x="75" y="5" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#a0a0b0" class="type-text">
      💡 Building the future, one line at a time
    </text>
    <text x="75" y="5" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#a0a0b0" class="type-text">
      🌍 Based in Cape Town, South Africa
    </text>
  </g>
  
  <!-- Tech Stack Tags - Floating -->
  <g transform="translate(40, 195)">
    <rect x="0" y="0" width="95" height="24" rx="12" fill="#00D4FF" opacity="0.15"/>
    <text x="47" y="16" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#00D4FF" font-weight="600">React</text>
    
    <rect x="105" y="0" width="85" height="24" rx="12" fill="#7B2FBE" opacity="0.15" class="floating-reverse"/>
    <text x="147" y="16" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#7B2FBE" font-weight="600">Java</text>
    
    <rect x="200" y="0" width="100" height="24" rx="12" fill="#FF6B8A" opacity="0.15" class="floating"/>
    <text x="250" y="16" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#FF6B8A" font-weight="600">JavaScript</text>
    
    <rect x="310" y="0" width="105" height="24" rx="12" fill="#00D4FF" opacity="0.15" class="floating-reverse"/>
    <text x="362" y="16" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#00D4FF" font-weight="600">TypeScript</text>
    
    <rect x="425" y="0" width="95" height="24" rx="12" fill="#7B2FBE" opacity="0.15" class="floating"/>
    <text x="472" y="16" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#7B2FBE" font-weight="600">Node.js</text>
    
    <rect x="530" y="0" width="95" height="24" rx="12" fill="#FF6B8A" opacity="0.15" class="floating-reverse"/>
    <text x="577" y="16" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#FF6B8A" font-weight="600">Python</text>
  </g>
  
  <!-- Decorative Line -->
  <line x1="40" y1="180" x2="640" y2="180" stroke="url(#accentGrad)" stroke-width="1" opacity="0.1"/>
  
  <!-- Status Indicator - Bottom Right -->
  <g transform="translate(680, 220)">
    <circle cx="0" cy="0" r="4" fill="#34C759">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="10" y="4" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#8e8e93">Open to opportunities</text>
  </g>
  
  <!-- Corner decorations -->
  <rect x="0" y="0" width="20" height="3" fill="#00D4FF" opacity="0.3" rx="1.5"/>
  <rect x="0" y="0" width="3" height="20" fill="#00D4FF" opacity="0.3" rx="1.5"/>
  <rect x="780" y="0" width="20" height="3" fill="#FF6B8A" opacity="0.3" rx="1.5"/>
  <rect x="797" y="0" width="3" height="20" fill="#FF6B8A" opacity="0.3" rx="1.5"/>
  <rect x="0" y="247" width="20" height="3" fill="#7B2FBE" opacity="0.3" rx="1.5"/>
  <rect x="0" y="230" width="3" height="20" fill="#7B2FBE" opacity="0.3" rx="1.5"/>
  <rect x="780" y="247" width="20" height="3" fill="#00D4FF" opacity="0.3" rx="1.5"/>
  <rect x="797" y="230" width="3" height="20" fill="#00D4FF" opacity="0.3" rx="1.5"/>
</svg>
