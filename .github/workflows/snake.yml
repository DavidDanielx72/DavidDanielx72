name: Generate Snake Animation

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: DavidDanielx72
          # Custom Pac-Man colors
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FFD700&color_dots=#FF6B6B,#FF8E8E,#FFD700,#4ECDC4,#6EE7DE
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FFD700
          
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
